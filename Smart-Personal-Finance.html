<title>Smart Personal Finance</title>
<style>/* ============ design tokens ============ */
:root {
  color-scheme: light;
  --bg: #f4f6fb; --surface: #ffffff; --surface-2: #eff2f8; --surface-3: #e4e9f2; --text: #0b1324; --muted: #58677f; --border: #e1e7f0; --border-strong: #cdd6e4;

  --c-income: #0d9488; --c-expense: #f97316; --grid: #e6ebf3; --focus: #0f766e; --exp-soft: #fff0e4; --exp-fg: #c2410c; --info-fg: #2563eb;
  --hero: linear-gradient(135deg, #0f766e 0%, #0e5f67 55%, #164e63 100%); --hero-fg: #ffffff;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05); --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 8px 24px rgba(15, 23, 42, .06); --shadow-lg: 0 24px 64px rgba(8, 15, 35, .28);
  --radius: 18px; --radius-sm: 12px; --nav-w: 252px;
  --font: system-ui, -apple-system, "Segoe UI", Tahoma, "Noto Sans Arabic", "Noto Sans", Arial, sans-serif;
}

    color-scheme: dark; --bg: #0a1020; --surface: #111a2e; --surface-2: #17223a; --surface-3: #1f2c49; --text: #e8eefb; --muted: #94a4be; --border: #223052; --border-strong: #2f4067;
    --accent: #2dd4bf; --accent-fg: #04201c; --accent-soft: #123a38; --accent-text: #5eead4; --danger: #f87171; --danger-soft: #3b1a1d; --warn: #fbbf24; --warn-soft: #3a2b0a; --ok: #4ade80; --ok-soft: #12311f; --info-soft: #15264a;
    --c-income: #2dd4bf; --c-expense: #fb923c; --grid: #22304d; --focus: #5eead4; --hero: linear-gradient(135deg, #0f766e 0%, #0d5560 55%, #17405a 100%); --exp-soft: #3a2412; --exp-fg: #fb923c; --info-fg: #7aa7ff;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35); --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .28);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark; --bg: #0a1020; --surface: #111a2e; --surface-2: #17223a; --surface-3: #1f2c49; --text: #e8eefb; --muted: #94a4be; --border: #223052; --border-strong: #2f4067;
  --accent: #2dd4bf; --accent-fg: #04201c; --accent-soft: #123a38; --accent-text: #5eead4; --danger: #f87171; --danger-soft: #3b1a1d; --warn: #fbbf24; --warn-soft: #3a2b0a; --ok: #4ade80; --ok-soft: #12311f; --info-soft: #15264a;
  --c-income: #2dd4bf; --c-expense: #fb923c; --grid: #22304d; --focus: #5eead4; --hero: linear-gradient(135deg, #0f766e 0%, #0d5560 55%, #17405a 100%); --exp-soft: #3a2412; --exp-fg: #fb923c; --info-fg: #7aa7ff;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35); --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .28);

/* ============ base ============ */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.skip { position: absolute; inset-inline-start: 0; top: 0; transform: translateY(-150%); background: var(--accent); color: var(--accent-fg); padding: .5rem 1rem; z-index: 100; }
.skip:focus { transform: none; }
.hint { color: var(--muted); font-size: .86rem; } .hint.block { display: block; } .sub { display: block; color: var(--muted); font-size: .8rem; font-weight: 400; }
.ok-text { color: var(--ok); } .warn-text { color: var(--warn); } .pos { color: var(--ok); } .neg { color: var(--danger); } .neu { color: var(--muted); }
.num { unicode-bidi: isolate; direction: ltr; font-variant-numeric: tabular-nums; white-space: nowrap; } .num.big { font-size: 1.5rem; font-weight: 750; letter-spacing: -.01em; }
.spacer { flex: 1; } .center { justify-content: center; } .ico { flex: none; }
@media (prefers-reduced-motion: no-preference) { main > * { animation: rise .22s ease both; } @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } } }

/* ============ app shell ============ */
#app { min-height: 100vh; }

[dir="rtl"] nav.side a.active::before { border-radius: 4px 0 0 4px; }
.brand { display: flex; align-items: center; gap: .65rem; font-weight: 750; padding: .3rem .6rem 1.1rem; letter-spacing: -.01em; } .brand.big { font-size: 1.45rem; justify-content: center; padding-bottom: .5rem; }
.logo { width: 34px; height: 34px; border-radius: 11px; background: var(--hero); color: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 4px 12px rgba(15, 118, 110, .35); }
.nav-foot { margin-top: auto; padding: .8rem .6rem 0; color: var(--muted); font-size: .78rem; border-top: 1px solid var(--border); }
.content { margin-inline-start: var(--nav-w); min-height: 100vh; }
header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .4rem; padding: .65rem 1.5rem; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent); }
main { padding: 1.5rem; max-width: 1240px; margin-inline: auto; padding-block-end: 5rem; } main:focus { outline: none; }
nav.bottom, .fab, .mobile-only { display: none; }
.more-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .75rem; } .more-item { display: flex; gap: .7rem; align-items: center; text-decoration: none; color: var(--text); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.1rem; } .page-sub { color: var(--muted); margin: .25rem 0 0; font-size: .92rem; } .page-actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

/* ============ components ============ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.2rem; box-shadow: var(--shadow-sm); margin-bottom: 1rem; }
.card.clickable { cursor: pointer; transition: transform .15s, box-shadow .15s; } .card.clickable:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 1rem; } .grid-cards > .card { margin: 0; } .span2 { grid-column: 1 / -1; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .9rem; margin-bottom: 1rem; }
.kpi { margin: 0; display: flex; flex-direction: column; gap: .35rem; padding: 1rem 1.1rem; } .kpi.accent { border-color: var(--accent); }
.kpi-top { display: flex; align-items: center; justify-content: space-between; gap: .5rem; } .kpi-label { color: var(--muted); font-size: .82rem; font-weight: 600; } .kpi-sub { color: var(--muted); font-size: .8rem; }
.kpi-ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; }
.kpi-ico.income { background: var(--ok-soft); color: var(--ok); } .kpi-ico.expense { background: var(--exp-soft); color: var(--exp-fg); } .kpi-ico.warn { background: var(--warn-soft); color: var(--warn); } .kpi-ico.info { background: var(--info-soft); color: var(--info-fg); }
.kpi-value { font-size: 1.45rem; font-weight: 750; line-height: 1.2; }
.delta { display: inline-flex; align-items: center; gap: .2rem; font-size: .76rem; font-weight: 650; padding: .1rem .5rem; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.delta.good { background: var(--ok-soft); color: var(--ok); } .delta.bad { background: var(--danger-soft); color: var(--danger); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1.85fr); gap: 1rem; margin-bottom: 1rem; } .hero-grid .kpis { margin: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.hero { background: var(--hero); color: var(--hero-fg); border: 0; border-radius: 22px; padding: 1.35rem 1.4rem; display: flex; flex-direction: column; gap: .5rem; margin: 0; box-shadow: 0 14px 34px rgba(15, 118, 110, .28); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset-inline-end: -60px; top: -60px; width: 190px; height: 190px; border-radius: 50%; background: rgba(255, 255, 255, .09); }
.hero .kpi-label, .hero .hint, .hero small { color: rgba(255, 255, 255, .8); } .hero .kpi-value, .hero .num.big { font-size: 2.1rem; color: #fff; } .hero .link { color: #fff; } .hero .neg { color: #ffd1cc; }
.hero-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; margin-top: auto; padding-top: .8rem; border-top: 1px solid rgba(255, 255, 255, .22); } .hero-meta div { display: flex; flex-direction: column; font-size: .78rem; color: rgba(255, 255, 255, .78); } .hero-meta .num { color: #fff; font-weight: 650; font-size: .95rem; }
.row { display: flex; gap: .5rem; align-items: center; flex-wrap: nowrap; } .row.wrap { flex-wrap: wrap; } .row.between { justify-content: space-between; } .row.end { justify-content: flex-end; margin-top: .85rem; } .row.tight { gap: .3rem; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem .8rem; } .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem .8rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; padding: .5rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; text-decoration: none; color: var(--text); min-height: 40px; font-weight: 550; transition: background .15s, border-color .15s, transform .05s; }
.btn:hover { background: var(--surface-2); } .btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 650; box-shadow: 0 2px 8px rgba(15, 118, 110, .25); } .btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; } .btn.danger:hover { background: var(--danger-soft); } .btn.danger.solid { background: var(--danger); color: #fff; } .btn.danger.solid:hover { background: var(--danger); filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); } .btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.small { padding: .25rem .7rem; min-height: 32px; font-size: .86rem; border-radius: 10px; } .btn.block { width: 100%; } .btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.active, .btn[aria-pressed="true"] { background: var(--danger-soft); border-color: var(--danger); }
.icon-btn { background: transparent; border: 0; padding: .4rem; border-radius: 10px; cursor: pointer; min-width: 40px; min-height: 40px; display: inline-grid; place-items: center; color: var(--muted); } .icon-btn:hover { background: var(--surface-2); color: var(--text); }
.link { background: none; border: 0; padding: 0; color: var(--accent-text); cursor: pointer; text-decoration: underline; font-size: inherit; }
input, select, textarea { width: 100%; padding: .55rem .75rem; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); min-height: 42px; transition: border-color .15s, box-shadow .15s; }
input:hover, select:hover, textarea:hover { border-color: var(--muted); } input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
input[type=checkbox] { width: 18px; height: 18px; min-height: 0; accent-color: var(--accent); flex: none; margin-top: .15rem; } input[type=color] { padding: 3px; height: 42px; } textarea { resize: vertical; line-height: 1.5; }
input[type=file] { padding: .4rem; } input[type=file]::file-selector-button { border: 0; background: var(--surface-2); padding: .35rem .8rem; border-radius: 8px; margin-inline-end: .7rem; cursor: pointer; color: var(--text); }
.field { display: flex; flex-direction: column; gap: .3rem; margin-bottom: .65rem; } .field .label { font-size: .8rem; color: var(--muted); font-weight: 650; } .field.inline { margin: 0; min-width: 130px; } .field.needs input, .field.needs select { border-color: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.check { display: flex; gap: .6rem; align-items: flex-start; margin: .45rem 0; cursor: pointer; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; } .seg button { border: 0; background: transparent; padding: .38rem .85rem; border-radius: 9px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: .86rem; } .seg button:hover { color: var(--text); } .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.toolbar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; justify-content: space-between; margin-bottom: 1rem; } .toolbar .more-filters { display: flex; gap: .6rem; flex-wrap: wrap; align-items: flex-end; width: 100%; padding: .9rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.period-label { color: var(--muted); font-size: .86rem; display: inline-flex; gap: .4rem; align-items: center; }
.filters { display: flex; gap: .6rem; flex-wrap: wrap; align-items: flex-end; } .filters > input[type=search] { max-width: 260px; } .filters select, .filters input[type=date] { min-width: 130px; }
.search { position: relative; flex: 1; min-width: 200px; max-width: 320px; } .search .ico { position: absolute; inset-inline-start: .75rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; } .search input { padding-inline-start: 2.4rem; }
.badge { display: inline-flex; align-items: center; padding: .1rem .6rem; border-radius: 999px; font-size: .75rem; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); margin-inline-end: .25rem; white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; } .badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; } .badge.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.badges { display: flex; flex-wrap: wrap; gap: .25rem; margin-bottom: .6rem; }
.banner { display: flex; gap: .6rem; align-items: center; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: var(--radius-sm); padding: .65rem .95rem; margin-bottom: 1rem; color: var(--text); } .banner.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.err-box { background: var(--danger-soft); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 50%, transparent); border-radius: var(--radius-sm); padding: .65rem .95rem; margin: .6rem 0; } .warn-box { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); border-radius: var(--radius-sm); padding: .65rem .95rem; margin: .6rem 0; white-space: pre-line; }
.empty { text-align: center; padding: 3rem 1rem; color: var(--muted); } .empty h3 { color: var(--text); font-size: 1.1rem; } .empty-icon { width: 72px; height: 72px; border-radius: 24px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; margin: 0 auto 1rem; }
.loading { display: flex; gap: .6rem; align-items: center; padding: 2rem; color: var(--muted); justify-content: center; } .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.sk { background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%); background-size: 200% 100%; border-radius: 14px; animation: shimmer 1.3s infinite linear; } @keyframes shimmer { to { background-position: -200% 0; } }
.sk-title { height: 34px; width: 220px; margin-bottom: 1.1rem; } .sk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: .9rem; margin-bottom: .9rem; } .sk-card { height: 104px; border-radius: 18px; } .sk-block { height: 280px; border-radius: 18px; }
@media (prefers-reduced-motion: reduce) { .spinner, .sk { animation: none; } }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; background: #94a3b8; } .dot.big { width: 14px; height: 14px; }
ul.plain { list-style: none; margin: 0; padding: 0; } ul.plain > li { padding: .35rem 0; } .status-list li { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
.progress { height: 9px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: .4rem 0; } .progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #5eead4)); border-radius: 99px; transition: width .5s cubic-bezier(.2, .8, .2, 1); } .progress.warning > span { background: #d98a00; } .progress.over > span { background: var(--danger); }
dl.stats { display: grid; grid-template-columns: auto 1fr; gap: .25rem .8rem; margin: .6rem 0; } dl.stats dt { color: var(--muted); font-size: .86rem; } dl.stats dd { margin: 0; text-align: end; font-weight: 600; } dl { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1rem; } dt { color: var(--muted); } dd { margin: 0; }
.budget { display: flex; flex-direction: column; gap: .3rem; } .budget.over { border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); } .budget.warning { border-color: color-mix(in srgb, var(--warn) 55%, var(--border)); } .budget-head { display: flex; align-items: center; gap: .9rem; } .budget-head h3 { margin: 0; } .account.archived, .archived { opacity: .6; }
.ring { flex: none; } .ring-bg { stroke: var(--surface-3); } .ring-fg { stroke: var(--accent); transition: stroke-dasharray .6s; } .ring.warning .ring-fg { stroke: #d98a00; } .ring.over .ring-fg { stroke: var(--danger); } .ring-text { fill: var(--text); font-size: 14px; font-weight: 700; }
.acct-ico { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; } .acct-head { display: flex; align-items: center; gap: .8rem; } .acct-head h3 { margin: 0; }
.legend-inline { display: flex; gap: .5rem; align-items: center; color: var(--muted); font-size: .82rem; justify-content: center; margin-top: .3rem; } .sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; margin-inline-start: .6rem; } .sw.income { background: var(--c-income); } .sw.expense { background: var(--c-expense); }

/* tables & lists */
.table-wrap { overflow-x: auto; padding: 0; } .table { width: 100%; border-collapse: collapse; } .table th, .table td { padding: .7rem .9rem; text-align: start; border-bottom: 1px solid var(--border); vertical-align: middle; } .table tbody tr:last-child td { border-bottom: 0; }
.table th { font-size: .74rem; color: var(--muted); font-weight: 650; white-space: nowrap; text-transform: uppercase; letter-spacing: .04em; background: var(--surface); position: sticky; top: 0; }
.table tr.clickable { cursor: pointer; } .table tr.clickable:hover { background: var(--surface-2); } .table td.amt { text-align: end; font-weight: 650; white-space: nowrap; } .table.compact th, .table.compact td { padding: .4rem .55rem; } .table tr.total td { font-weight: 700; border-top: 2px solid var(--border-strong); }
.th-btn { background: none; border: 0; font: inherit; color: inherit; cursor: pointer; padding: 0; font-weight: 650; text-transform: inherit; letter-spacing: inherit; } .chip-cat { display: inline-flex; align-items: center; gap: .45rem; }

t) : null);\nexport const select = (options, value, props = {}) => {\n  const el = h('select', props, options.map((o) => h('option', { value: o.value, selected: String(o.value) === String(value) }, o.label)));\n  el.value = value ?? options[0]?.value ?? ''; return el;\n};\nexport const badge = (text, kind = '') => h('span', { class: `badge ${kind}` }, text);\nexport const empty = (title, text, action) => h('div', { class: 'empty' }, h('div', { class: 'empty-icon', 'aria-hidden': 'true' }, icon('wallet', 32)), h('h3', {}, title), text ? h('p', {}, text) : null, action ?? null);\n// skeleton placeholder keeps the layout stable while data loads\nexport const loading = () => h('div', { class: 'skeleton-page', role: 'status', 'aria-label': t('loading') }, h('div', { class: 'sk sk-title' }), h('div', { class: 'sk-row' }, h('div', { class: 'sk sk-card' }), h('div', { class: 'sk sk-card' }), h('div', { class: 'sk sk-card' })), h('div', { class: 'sk sk-block' }));\n// consistent page header: title, optional subtitle, actions on the end side\nexport const pageHeader = (title, sub, ...actions) => h('div', { class: 'page-head' }, h('div', {}, h('h1', {}, title), sub ? h('p', { class: 'page-sub' }, sub) : null), actions.length ? h('div', { class: 'page-actions' }, actions) : null);\n","server/lib/ai.js":"// Optional LLM extraction. DISABLED unless ANTHROPIC_API_KEY is set AND the user opted in (profile.allow_ai_external).\n// Only the free text typed by the user is sent - never balances, history or account names.\n// NOTE: this path has not been exercised against the live API in this repository (no key available);\n// its output is always passed through validateDraft() and falls back to the rule parser on any failure.\nconst env = () => globalThis.process?.env ?? {}; // no `process` in the browser build: LLM extraction is simply off there\nconst MODEL = () => env().AI_MODEL || 'claude-sonnet-5-5';\nexport const llmConfigured = () => Boolean(env().ANTHROPIC_API_KEY);\n\nconst SYSTEM = `You extract personal finance transactions from short user messages (Arabic or English).\nReturn ONLY a JSON array. Each element: {\"type\":\"expense|income|transfer|refund|debt_payment\",\"amount\":\"123.45\",\"currency\":\"ISO 4217 or null\",\"date\":\"YYYY-MM-DD\",\n\"description\":\"short\",\"merchant\":null,\"payment_method\":\"cash|mada|credit_card|apple_pay|stc_pay|null\",\"tags\":[],\"category_key\":\"snake_case key or null\",\"confidence\":0..1}.\nNever invent amounts, merchants or dates that are not in the message. Convert Arabic-Indic digits. One element per distinct transaction.`;\n\nexport async function llmExtract(text, { today, currency }) {\n  const res = await fetch('https://api.anthropic.com/v1/messages', {\n    method: 'POST', signal: AbortSignal.timeout(15000),\n    headers: { 'content-type': 'application/json', 'x-api-key': env().ANTHROPIC_API_KEY, 'anthropic-version': '2023-06-01' },\n    body: JSON.stringify({ model: MODEL(), max_tokens: 1024, system: SYSTEM, messages: [{ role: 'user', content: `Today: ${today}. Default currency: ${currency}.\\nMessage: ${text}` }] }),\n  });\n  if (!res.ok) throw new Error(`llm_http_${res.status}`);\n  const data = await res.json();\n  const raw = data?.content?.find((c) => c.type === 'text')?.text ?? '';\n  const json = raw.slice(raw.indexOf('['), raw.lastIndexOf(']') + 1);\n  const arr = JSON.parse(json);\n  if (!Array.isArray(arr)) throw new Error('llm_bad_shape');\n  return arr.map((x) => ({ ...x, currency: x.currency || currency }));\n}\n","server/lib/assistant.js":"// Financial assistant: deterministic intent router over trusted calculation services.\n// No LLM is involved, so no number can be invented: every figure comes from finance.js queries.\n// The assistant is read-only (no tool here can write or delete data).\nimport { all } from './base.js';\nimport { normalizeDigits } from './parser.js';\nimport { heavy, light } from './classifier.js';\nimport { fromMinor, exponent } from './money.js';\nimport { addDays, monthPeriod, previousPeriod, weekPeriod, diffDays } from './dates.js';\nimport { summary, budgetStatus, recurringStatus, occurrencesUntil, safeToSpend, forecastMonth, periodsBack } from './finance.js';\n\nconst WORDS = { واحد: 1, اثنين: 2, ثلاثه: 3, اربعه: 4, خمسه: 5, خمس: 5, ستة: 6, سبعه: 7, ثمانيه: 8, تسعه: 9, عشره: 10, عشر: 10, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, ten: 10 };\n\nexport function answer(db, userId, profile, question) {\n  const ar = profile.language === 'ar';\n  const L = (a, e) => (ar ? a : e);\n  const cur = profile.currency;\n  const money = (minor, c = cur) => `${new Intl.NumberFormat('en-US', { minimumFractionDigits: exponent(c) === 0 ? 0 : 2, maximumFractionDigits: exponent(c) }).format(Number(fromMinor(minor, c)))} ${c}`;\n  const catName = (id) => { const c = all(db, 'SELECT name_ar,name_en FROM categories WHERE id=? AND user_id=?', id, userId)[0]; return c ? L(c.name_ar, c.name_en) : L('غير مصنف', 'Unclassified'); };\n  const text = heavy(light(normalizeDigits(question))).replace(/[؟?!.]/g, ' ');\n  const num = () => { const m = /(\\d[\\d,]*(?:\\.\\d+)?)/.exec(text); if (m) return Number(m[1].replace(/,/g, '')); for (const [w, n] of Object.entries(WORDS)) if (text.includes(heavy(w))) return n; return null; };\n  const mp = monthPeriod(profile.today, profile.month_start_day);\n  const base = { intent: null, text: '', data: null, period: null, assumptions: [] };\n  const done = (o) => ({ ...base, ...o });\n  const toMinor = (n) => Math.round(n * 10 ** exponent(cur));\n\n  // 1. affordability\n  if (/(هل يمكنني|هل اقدر|اقدر اشتري|can i (afford|buy)|afford)/.test(text) && num()) {\n    const price = toMinor(num()); const s = safeToSpend(db, userId, profile); const fc = forecastMonth(db, userId, profile);\n    const ok = s.accounts_used.length > 0 && s.safe >= price;\n    const t = !s.accounts_used.length\n      ? L('لا توجد حسابات نقدية أو بنكية مسجلة بعملتك الافتراضية، لذلك لا أستطيع الحكم على إمكانية الشراء.', 'No cash/bank accounts are recorded in your default currency, so I cannot judge affordability.')\n      : ok ? L(`نعم ضمن المتاح الآمن: ${money(s.safe)}. بعد الشراء يتبقى ${money(s.safe - price)}.`, `Yes, within your safe-to-spend of ${money(s.safe)}. After the purchase ${money(s.safe - price)} remains.`)\n        : L(`لا يناسب خطتك الحالية: المتاح الآمن ${money(s.safe)} والمبلغ ${money(price)} (العجز ${money(price - s.safe)}).`, `Not within your current plan: safe-to-spend is ${money(s.safe)} vs ${money(price)} (short by ${money(price - s.safe)}).`);\n    return done({ intent: 'affordability', text: t, data: { price, safe: s.safe, forecast: fc.projected }, period: mp,\n      assumptions: [L('المتاح الآمن = الأرصدة المسجلة − الالتزامات المستحقة هذا الشهر − احتياطي الأهداف', 'Safe-to-spend = tracked balances − obligations due this period − goals reserve'), L('الأرصدة مسجلة وليست مؤكدة من البنك', 'Balances are tracked, not bank-verified')] });\n  }\n  // 2. saving plan\n  if (/(ادخار|ادخر|اوفر|توفير|save|saving)/.test(text) && num() && /(شهري|monthly|month|كل شهر)/.test(text)) {\n    const target = toMinor(num()); const per = periodsBack(profile, 4).slice(0, 3);\n    const sums = per.map((p) => summary(db, userId, { from: p.start, to: p.end, currency: cur }));\n    const avgSpend = Math.round(sums.reduce((a, s) => a + s.net_spend, 0) / 3), avgInc = Math.round(sums.reduce((a, s) => a + s.income, 0) / 3);\n    const fixedKeys = new Set(all(db, \"SELECT id FROM categories WHERE user_id=? AND key IN ('home','obligations','health')\", userId).map((r) => r.id));\n    const cats = new Map();\n    for (const s of sums) for (const c of s.by_top_category) if (!fixedKeys.has(c.category_id)) cats.set(c.category_id, (cats.get(c.category_id) ?? 0) + c.amount / 3);\n    const disc = [...cats].map(([id, a]) => ({ category_id: id, avg: Math.round(a) })).filter((x) => x.avg > 0).sort((a, b) => b.avg - a.avg);\n    const discTotal = disc.reduce((a, x) => a + x.avg, 0); const surplus = avgInc - avgSpend;\n    const gap = Math.max(0, target - Math.max(0, surplus));\n    const plan = disc.map((x) => ({ ...x, cut: discTotal ? Math.round((gap * x.avg) / discTotal) : 0 }));\n    const t = !sums.some((s) => s.tx_count) ? L('لا توجد بيانات كافية في آخر ثلاث فترات لبناء خطة.', 'Not enough data in the last three periods to build a plan.')\n      : gap === 0 ? L(`متوسط فائضك الشهري ${money(surplus)} وهو يغطي ${money(target)} دون تقليص.`, `Your average monthly surplus of ${money(surplus)} already covers ${money(target)} without cuts.`)\n        : discTotal \u003c gap ? L(`متوسط الفائض ${money(surplus)}؛ تحتاج ${money(gap)} إضافية لكن الإنفاق الاختياري المتوسط ${money(discTotal)} فقط، فلا يكفي تقليصه وحده.`, `Average surplus is ${money(surplus)}; you need ${money(gap)} more but average discretionary spend is only ${money(discTotal)}, so cutting it alone is not enough.`)\n          : L(`لادخار ${money(target)} شهريًا مع متوسط فائض ${money(surplus)} تحتاج تقليص ${money(gap)} من الإنفاق الاختياري (${Math.round((gap / discTotal) * 100)}%): ` + plan.filter((x) => x.cut > 0).slice(0, 5).map((x) => `${catName(x.category_id)} −${money(x.cut)}`).join('، '),\n            `To save ${money(target)}/month with an average surplus of ${money(surplus)} you need to cut ${money(gap)} (${Math.round((gap / discTotal) * 100)}% of discretionary spend): ` + plan.filter((x) => x.cut > 0).slice(0, 5).map((x) => `${catName(x.category_id)} −${money(x.cut)}`).join(', '));\n    return done({ intent: 'save_plan', text: t, data: { target, avg_income: avgInc, avg_spend: avgSpend, surplus, gap, plan }, period: { start: per[0].start, end: per[2].end },\n      assumptions: [L('المتوسط لآخر ثلاث فترات مالية مكتملة', 'Averages over the last three completed financial periods'), L('الإسكان والالتزامات والصحة تعتبر ثابتة', 'Home, obligations and health treated as fixed')] });\n  }\n  // 3. top merchants\n  if (/(تجار|متاجر|merchants|stores|shops)/.test(text) && /(اعلي|اكثر|top|most|highest)/.test(text)) {\n    const n = Math.min(num() ?? 5, 20); const s = summary(db, userId, { from: mp.start, to: mp.end, currency: cur });\n    const list = all(db, `SELECT m.name, SUM(t.amount) amount, COUNT(*) count FROM transactions t JOIN merchants m ON m.id=t.merchant_id WHERE t.user_id=? AND t.deleted_at IS NULL AND t.type='expense' AND t.currency=? AND t.date BETWEEN ? AND ? GROUP BY m.id ORDER BY amount DESC LIMIT ?`, userId, cur, mp.start, mp.end, n);\n    const t = list.length ? L(`أعلى ${list.length} تجار هذا الشهر: `, `Top ${list.length} merchants this period: `) + list.map((x, i) => `${i + 1}. ${x.name} ${money(x.amount)} (${x.count})`).join(L('، ', ', ')) : L('لا توجد عمليات مرتبطة بتجار في هذه الفترة.', 'No merchant-linked transactions in this period.');\n    return done({ intent: 'top_merchants', text: t, data: list, period: mp, assumptions: [L('العمليات بلا تاجر مسجل غير مشمولة', 'Transactions without a recorded merchant are excluded')] });\n  }\n  // 4. compare months\n  if (/(قارن|مقارنه|compare)/.test(text) && /(اشهر|شهور|months|month)/.test(text)) {\n    const n = Math.min(num() ?? 3, 12); const per = periodsBack(profile, n);\n    const rows = per.map((p) => { const s = summary(db, userId, { from: p.start, to: p.end, currency: cur }); return { start: p.start, end: p.end, net_spend: s.net_spend, income: s.income }; });\n    return done({ intent: 'compare_months', text: L(`مقارنة آخر ${n} فترات: `, `Last ${n} periods: `) + rows.map((r) => `${r.start.slice(0, 7)}: ${money(r.net_spend)}`).join(L('، ', ', ')) + L(' (الأخيرة قد تكون جزئية)', ' (the latest may be partial)'), data: rows, period: { start: per[0].start, end: per[n - 1].end }, assumptions: [L('صافي الإنفاق = المصروفات − الاستردادات', 'Net spend = expenses − refunds')] });\n  }\n  // 5. which category increased\n  if (/(الفيه|الفئه|فئه|التصنيف|category|categories)/.test(text) && /(زاد|ارتفع|زياده|increase|increased|rose|grew|up)/.test(text)) {\n    const pp = previousPeriod('monthly', mp, profile.month_start_day);\n    const elapsed = diffDays(mp.start, profile.today); const a = summary(db, userId, { from: mp.start, to: profile.today, currency: cur }), b = summary(db, userId, { from: pp.start, to: addDays(pp.start, elapsed), currency: cur });\n    const pm = new Map(b.by_top_category.map((c) => [c.category_id, c.amount]));\n    const deltas = a.by_top_category.map((c) => ({ category_id: c.category_id, current: c.amount, previous: pm.get(c.category_id) ?? 0, delta: c.amount - (pm.get(c.category_id) ?? 0) })).filter((d) => d.delta > 0).sort((x, y) => y.delta - x.delta).slice(0, 3);\n    return done({ intent: 'category_increase', text: deltas.length ? L('أكبر زيادة مقارنة بنفس الفترة من الشهر السابق: ', 'Largest increases vs the same days last period: ') + deltas.map((d) => `${catName(d.category_id)} +${money(d.delta)}`).join(L('، ', ', ')) : L('لم ترتفع أي فئة مقارنة بنفس الفترة السابقة.', 'No category increased vs the same days last period.'), data: deltas, period: { start: mp.start, end: profile.today }, assumptions: [L(`مقارنة أول ${elapsed + 1} يومًا من كل فترة`, `Compares the first ${elapsed + 1} days of each period`)] });\n  }\n  // 6. budget remaining\n  if (/(يتبقي|متبقي|المتبقي|remaining|left)/.test(text) && /(ميزانيه|budget)/.test(text)) {\n    const cats = all(db, 'SELECT id,name_ar,name_en,parent_id FROM categories WHERE user_id=?', userId);\n    const hit = cats.filter((c) => text.includes(heavy(c.name_ar).replace(/^ال/, '')) || text.includes(heavy(c.name_en))).sort((x, y) => (x.parent_id ? 1 : 0) - (y.parent_id ? 1 : 0))[0];\n    const bs = budgetStatus(db, userId, profile).filter((b) => b.currency === cur && b.period === 'monthly');\n    const b = hit ? bs.find((x) => x.category_id === hit.id) : bs.find((x) => !x.category_id);\n    const t = b ? L(`${hit ? catName(hit.id) : 'الميزانية الإجمالية'}: الميزانية ${money(b.limit)}، المصروف ${money(b.spent)}، المتبقي ${money(b.remaining)} (${b.pct}%).`, `${hit ? catName(hit.id) : 'Overall budget'}: budget ${money(b.limit)}, spent ${money(b.spent)}, remaining ${money(b.remaining)} (${b.pct}%).`)\n      : L('لا توجد ميزانية شهرية مطابقة. أنشئ ميزانية من صفحة الميزانيات.', 'No matching monthly budget. Create one on the Budgets page.');\n    return done({ intent: 'budget_left', text: t, data: b ?? null, period: b ? { start: b.period_start, end: b.period_end } : mp });\n  }\n  // 7. upcoming obligations\n  if (/(الالتزامات|مستحق|فواتير|due|obligations|bills|upcoming)/.test(text)) {\n    const week = /(اسبوع|week)/.test(text); const end = week ? addDays(profile.today, 7) : mp.end;\n    const items = []; for (const r of recurringStatus(db, userId, profile.today)) if (r.active && r.type !== 'income') for (const d of occurrencesUntil(r, end)) items.push({ name: r.name, due: d, amount: r.amount, currency: r.currency });\n    items.sort((a, b) => (a.due \u003c b.due ? -1 : 1));\n    const totals = new Map(); items.forEach((i) => totals.set(i.currency, (totals.get(i.currency) ?? 0) + i.amount));\n    return done({ intent: 'obligations', text: items.length ? L(`الالتزامات حتى ${end}: `, `Obligations through ${end}: `) + items.map((i) => `${i.name} ${i.due} ${money(i.amount, i.currency)}`).join(L('، ', ', ')) + L(' — الإجمالي ', ' — total ') + [...totals].map(([c, a]) => money(a, c)).join(' + ') : L('لا التزامات مستحقة في هذه الفترة.', 'No obligations due in that window.'), data: items, period: { start: profile.today, end } });\n  }\n  // 8. spending totals\n  if (/(كم انفقت|كم صرفت|how much|spent|spending|مصروفاتي|انفاقي)/.test(text)) {\n    let p = mp, label = L('هذا الشهر', 'this period');\n    if (/(الشهر الماضي|last month|previous)/.test(text)) { p = previousPeriod('monthly', mp, profile.month_start_day); label = L('الشهر الماضي', 'last period'); }\n    else if (/(اسبوع|week)/.test(text)) { p = weekPeriod(profile.today); label = L('هذا الأسبوع', 'this week'); }\n    const to = p.end > profile.today ? profile.today : p.end;\n    const s = summary(db, userId, { from: p.start, to, currency: cur });\n    const top = s.by_top_category.slice(0, 3).map((c) => `${catName(c.category_id)} ${money(c.amount)}`).join(L('، ', ', '));\n    return done({ intent: 'spend_total', text: L(`أنفقت ${label} ${money(s.net_spend)} (${s.tx_count} عملية). الدخل ${money(s.income)}.${top ? ` الأعلى: ${top}.` : ''}`, `You spent ${money(s.net_spend)} ${label} (${s.tx_count} transactions). Income ${money(s.income)}.${top ? ` Top: ${top}.` : ''}`), data: { net_spend: s.net_spend, income: s.income, by_category: s.by_top_category.slice(0, 5) }, period: { start: p.start, end: to },\n      assumptions: [L('التحويلات الداخلية والادخار وسداد الديون غير محسوبة كمصروف', 'Internal transfers, savings and debt payments are not counted as spending'), s.other_currencies.length ? L('توجد عمليات بعملات أخرى غير مشمولة', 'Transactions in other currencies are excluded') : null].filter(Boolean) });\n  }\n  return done({ intent: 'unknown', text: L('لم أفهم السؤال. يمكنني الإجابة عن: الإنفاق خلال فترة، مقارنة الأشهر، أعلى التجار، المتبقي من ميزانية فئة، الالتزامات القادمة، إمكانية شراء مبلغ، وخطة ادخار شهري.', 'I did not understand. I can answer: spending in a period, month comparison, top merchants, remaining budget for a category, upcoming obligations, whether you can afford a purchase, and a monthly saving plan.') });\n}\n","server/lib/base.js":"// Small shared helpers: errors, query shortcuts, profile access.\nimport { todayIn } from './dates.js';\n\nexport class HttpError extends Error {\n  constructor(status, code, details) { super(code); this.status = status; this.code = code; this.details = details; }\n}\nexport const bad = (code, details) => new HttpError(400, code, details);\nexport const notFound = (what = 'not_found') => new HttpError(404, what);\n\nconst norm = (p) => p.map((v) => (v === undefined ? null : v));\nexport const all = (db, sql, ...p) => db.prepare(sql).all(...norm(p));\nexport const one = (db, sql, ...p) => db.prepare(sql).get(...norm(p)) ?? null;\nexport const run = (db, sql, ...p) => db.prepare(sql).run(...norm(p));\n\nexport function getProfile(db, userId) {\n  const p = one(db, 'SELECT * FROM profiles WHERE user_id=?', userId);\n  if (!p) throw notFound('profile');\n  p.notif_prefs = JSON.parse(p.notif_prefs); p.safe_prefs = JSON.parse(p.safe_prefs);\n  p.today = todayIn(p.timezone);\n  return p;\n}\n\n// Ownership guard used everywhere a client supplies an id.\nexport function owned(db, table, id, userId) {\n  if (id === null || id === undefined || id === '') return null;\n  const row = one(db, `SELECT * FROM ${table} WHERE id=? AND user_id=?`, Number(id), userId);\n  if (!row) throw new HttpError(404, `${table}_not_found`);\n  return row;\n}\n\nexport function categoryTree(db, userId) {\n  const cats = all(db, 'SELECT * FROM categories WHERE user_id=? ORDER BY id', userId);\n  const byParent = new Map();\n  for (const c of cats) { const k = c.parent_id ?? 0; (byParent.get(k) ?? byParent.set(k, []).get(k)).push(c); }\n  return { cats, byId: new Map(cats.map((c) => [c.id, c])), childrenOf: (id) => byParent.get(id) ?? [] };\n}\n// category id plus all descendants\nexport function categoryScope(db, userId, id) {\n  const t = categoryTree(db, userId); const out = [Number(id)];\n  const walk = (x) => { for (const c of t.childrenOf(x)) { out.push(c.id); walk(c.id); } };\n  walk(Number(id)); return out;\n}\nexport const categoryIdByKey = (db, userId, key) => one(db, 'SELECT id FROM categories WHERE user_id=? AND key=?', userId, key)?.id ?? null;\n","server/lib/capture.js":"// Smart capture: Input -> Parsing -> Classification -> Validation -> User review -> Commit.\nimport { tx as dbtx } from '../db.js';\nimport { all, one, run, bad, HttpError } from './base.js';\nimport { parseText } from './parser.js';\nimport { classifyForUser, normalize, findDuplicates, insertNormalized, TYPES } from './tx.js';\nimport { SUPPORTED_CURRENCIES, toMinor } from './money.js';\nimport { isIsoDate } from './dates.js';\nimport { DEFAULT_CATEGORIES } from '../db.js';\nimport { llmConfigured, llmExtract } from './ai.js';\n\nconst VALID_KEYS = new Set(DEFAULT_CATEGORIES.flatMap(([k,,,,,, kids]) => [k, ...kids.map((x) => x[0])]));\n\n// Strict schema gate for anything an LLM (or any non-rule source) proposes.\nexport function validateDraft(it) {\n  if (!it || typeof it !== 'object') return null;\n  if (!TYPES.includes(it.type)) return null;\n  if (!/^\\d+(\\.\\d{1,3})?$/.test(String(it.amount)) || !(Number(it.amount) > 0)) return null;\n  if (!SUPPORTED_CURRENCIES.includes(it.currency)) return null;\n  if (!isIsoDate(it.date)) return null;\n  return {\n    type: it.type, amount: String(it.amount), currency: it.currency, currency_assumed: false, date: it.date, date_given: true,\n    description: String(it.description ?? '').slice(0, 200), merchant: it.merchant ? String(it.merchant).slice(0, 80) : null,\n    payment_method: ['cash', 'mada', 'credit_card', 'apple_pay', 'stc_pay'].includes(it.payment_method) ? it.payment_method : null,\n    tags: Array.isArray(it.tags) ? it.tags.map(String).slice(0, 10) : [],\n    category_key: VALID_KEYS.has(it.category_key) ? it.category_key : null, confidence: Math.min(0.8, Math.max(0, Number(it.confidence) || 0.5)),\n    reason_key: 'ai', reason: 'AI suggestion', needs: [], assumptions: [],\n  };\n}\n\nfunction suggestAccount(db, userId, item, accounts, profile) {\n  const pick = (types) => { const m = accounts.filter((a) => types.includes(a.type) && a.currency === item.currency); return m.length === 1 ? m[0] : null; };\n  let a = null;\n  if (item.payment_method === 'credit_card') a = pick(['credit_card']);\n  else if (item.payment_method === 'cash') a = pick(['cash']);\n  else if (['apple_pay', 'stc_pay'].includes(item.payment_method)) a = pick(['wallet', 'bank']);\n  else if (item.payment_method === 'mada') a = pick(['bank']);\n  if (!a && profile.default_account_id) a = accounts.find((x) => x.id === profile.default_account_id) ?? null; // only the user's explicit default\n  return a;\n}\n\nexport async function capture(db, userId, text, profile) {\n  const t = String(text ?? '').trim();\n  if (!t) throw bad('empty_text');\n  let engine = 'rules', warnings = [];\n  let parsed = parseText(t, { today: profile.today, defaultCurrency: profile.currency });\n  let items = parsed.items; warnings.push(...parsed.warnings);\n  if (llmConfigured() && profile.allow_ai_external && (items.length === 0 || items.some((i) => i.needs.length))) {\n    try {\n      const drafts = (await llmExtract(t, { today: profile.today, currency: profile.currency })).map(validateDraft).filter(Boolean);\n      if (drafts.length) { items = drafts; engine = 'llm+validation'; }\n    } catch { warnings.push('ai_unavailable'); }\n  }\n  const accounts = all(db, 'SELECT id,name,type,currency FROM accounts WHERE user_id=? AND archived=0', userId);\n  const out = [];\n  for (const it of items) {\n    const cls = it.type === 'transfer' ? { category_id: null, confidence: 0, reason_key: 'none' } : classifyForUser(db, userId, it);\n    let category_id = cls.category_id ?? null;\n    const aiKey = it.reason_key === 'ai' ? it.category_key : null;\n    if (aiKey && !category_id) category_id = one(db, 'SELECT id FROM categories WHERE user_id=? AND key=?', userId, aiKey)?.id ?? null;\n    const confidence = it.reason_key === 'ai' ? it.confidence : (category_id ? cls.confidence : 0);\n    const catKind = category_id ? one(db, 'SELECT kind FROM categories WHERE id=?', category_id)?.kind : null;\n    if (it.type === 'income' && catKind && catKind !== 'income') category_id = null;\n    const needs = new Set(it.needs); if (category_id && confidence >= 0.6) needs.delete('category'); else if (it.type !== 'transfer') needs.add('category');\n    const acct = suggestAccount(db, userId, it, accounts, profile);\n    const currency = acct && it.currency_assumed ? acct.currency : it.currency;\n    const draft = { ...it, currency, category_id, confidence, reason_key: it.reason_key === 'ai' ? 'ai' : cls.reason_key ?? it.reason_key, account_id: acct?.id ?? null, to_account_id: null, needs: [...needs],\n      status: needs.has('category') ? 'review' : 'confirmed' };\n    try {\n      const mname = it.merchant ?? null;\n      draft.duplicates = findDuplicates(db, userId, { type: it.type, amount: toMinor(it.amount, currency), currency, date: it.date, description: it.description, merchant_name: mname });\n    } catch { draft.duplicates = []; }\n    out.push(draft);\n  }\n  // identical drafts inside the same message are flagged for the user, not silently merged\n  out.forEach((d, i) => { if (out.some((e, j) => j \u003c i && e.amount === d.amount && e.description === d.description && e.date === d.date)) d.duplicate_in_batch = true; });\n  const sid = out.length ? Number(run(db, 'INSERT INTO ai_suggestions (user_id,input_text,output,engine) VALUES (?,?,?,?)', userId, t.slice(0, 2000), JSON.stringify(out), engine).lastInsertRowid) : null;\n  return { suggestion_id: sid, engine, items: out, warnings };\n}\n\n// All-or-nothing save of reviewed drafts (single DB transaction).\nexport function commitCapture(db, userId, { suggestion_id = null, items = [], force = false }, profile) {\n  if (!Array.isArray(items) || !items.length) throw bad('no_items');\n  if (items.length > 50) throw bad('too_many_items');\n  const norms = items.map((it, index) => {\n    try {\n      const n = normalize(db, userId, { ...it, source: 'nl', status: it.status === 'review' || (!it.category_id && it.type !== 'transfer') ? 'review' : 'confirmed' }, profile);\n      return n;\n    } catch (e) { if (e instanceof HttpError) { e.details = { ...(e.details ?? {}), index }; } throw e; }\n  });\n  if (!force) {\n    const dupMap = {};\n    norms.forEach((n, i) => {\n      const mname = n.merchant_id ? one(db, 'SELECT name FROM merchants WHERE id=?', n.merchant_id)?.name : null;\n      const d = findDuplicates(db, userId, { ...n, merchant_name: mname }); if (d.length) dupMap[i] = d;\n    });\n    if (Object.keys(dupMap).length) throw new HttpError(409, 'possible_duplicate', { by_index: dupMap });\n  }\n  const ids = dbtx(db, () => norms.map((n) => insertNormalized(db, userId, n)));\n  if (suggestion_id) {\n    const s = one(db, 'SELECT output FROM ai_suggestions WHERE id=? AND user_id=?', Number(suggestion_id), userId);\n    if (s) {\n      const orig = JSON.parse(s.output);\n      const edited = orig.length !== items.length || orig.some((o, i) => String(o.amount) !== String(items[i].amount) || o.category_id !== (items[i].category_id ?? null));\n      run(db, 'UPDATE ai_suggestions SET status=? WHERE id=? AND user_id=?', edited ? 'edited' : 'accepted', Number(suggestion_id), userId);\n    }\n  }\n  return ids;\n}\n","server/lib/classifier.js":"// Rule-based classifier: keyword stems (ar/en) + known merchants. Pure functions, no DB.\n// Used as the deterministic first pass; user-learned rules and merchant defaults override it (see capture.js).\n\n// 1:1 character mapping so string positions stay aligned with the light-normalized text.\nexport function heavy(s) {\n  return String(s).toLowerCase()\n    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي');\n}\nexport function light(s) {\n  return String(s).replace(/[ً-ٰٟـ]/g, '') // tashkeel + tatweel\n    .replace(/[‎‏‪-‮]/g, '').trim();\n}\n\nexport const KEYWORDS = {\n  fuel: ['بنزين', 'وقود', 'ديزل', 'fuel', 'petrol', 'gas station', 'gasoline'],\n  electricity: ['كهرباء', 'electric'],\n  water: ['مياه', 'water bill'],\n  rent: ['ايجار', 'rent'],\n  furniture: ['اثاث', 'furniture', 'كنب', 'سرير'],\n  groceries: ['بقاله', 'خضار', 'فواكه', 'تموين', 'groceries', 'grocery', 'supermarket', 'سوبرماركت'],\n  restaurants: ['غداء', 'عشاء', 'فطور', 'مطعم', 'وجبه', 'برجر', 'بيتزا', 'lunch', 'dinner', 'breakfast', 'restaurant', 'burger', 'pizza'],\n  coffee: ['قهوه', 'كوفي', 'لاتيه', 'كابتشينو', 'كافيه', 'coffee', 'latte', 'cafe', 'cappuccino'],\n  delivery: ['توصيل', 'delivery'],\n  car_maintenance: ['قطع الغيار', 'قطع غيار', 'تغيير زيت', 'زيت المحرك', 'اطارات', 'ورشه', 'spare parts', 'car repair', 'oil change', 'tires'],\n  parking: ['موقف', 'مواقف', 'parking'],\n  public_transport: ['مترو', 'باص', 'حافله', 'تاكسي', 'اوبر', 'كريم', 'metro', 'taxi', 'uber', 'careem', 'bus'],\n  pharmacy: ['صيدليه', 'دواء', 'ادويه', 'pharmacy', 'medicine'],\n  clinics: ['عياده', 'طبيب', 'دكتور', 'مستشفي', 'اسنان', 'clinic', 'doctor', 'hospital', 'dentist'],\n  insurance: ['تامين', 'insurance'],\n  clothing: ['ملابس', 'حذاء', 'جزمه', 'ثوب', 'clothes', 'shoes', 'clothing', 'dress'],\n  electronics: ['جوال', 'لابتوب', 'سماعه', 'شاشه', 'شاحن', 'laptop', 'phone', 'headphones', 'electronics', 'charger'],\n  personal_care: ['حلاقه', 'صالون', 'عطر', 'مكياج', 'perfume', 'salon', 'barber', 'makeup'],\n  installments: ['قسط', 'اقساط', 'installment'],\n  debts: ['قرض', 'ديون', 'loan', 'debt'],\n  subscriptions: ['اشتراك', 'رسوم', 'subscription', 'netflix', 'spotify', 'fees'],\n  children: ['اطفال', 'طفل', 'حفاض', 'العاب اطفال', 'kids', 'diapers', 'toys'],\n  education: ['مدرسه', 'دورات', 'كورس', 'جامعه', 'tuition', 'school', 'course', 'university'],\n  travel: ['سفر', 'تذكره طيران', 'فندق', 'حجز', 'hotel', 'flight', 'travel'],\n  hobbies: ['نادي', 'رياضه', 'سينما', 'gym', 'cinema', 'hobby'],\n  savings: ['ادخار', 'استثمار', 'اسهم', 'saving', 'invest'],\n  salary: ['راتب', 'salary', 'payroll'],\n  bonus: ['مكافاه', 'bonus'],\n  other_income: ['دخل اضافي', 'عمل حر', 'freelance', 'side income'],\n  // Deliberately ambiguous: could be home or car - classified with low confidence below.\n  _maintenance: ['صيانه', 'maintenance'],\n};\n\n// multi = sells many categories, so the merchant alone must not decide (lower confidence).\nexport const MERCHANTS = [\n  ['كارفور', 'carrefour', 'groceries', true], ['لولو', 'lulu', 'groceries', true], ['بنده', 'panda', 'groceries', true],\n  ['العثيم', 'othaim', 'groceries', true], ['التميمي', 'tamimi', 'groceries', true], ['نون', 'noon', 'shopping', true],\n  ['امازون', 'amazon', 'shopping', true], ['ايكيا', 'ikea', 'furniture', true], ['جرير', 'jarir', 'electronics', true],\n  ['اكسترا', 'extra', 'electronics', true], ['ستاربكس', 'starbucks', 'coffee', false], ['دانكن', 'dunkin', 'coffee', false],\n  ['ماكدونالدز', 'mcdonald', 'restaurants', false], ['البيك', 'albaik', 'restaurants', false], ['هنقرستيشن', 'hungerstation', 'delivery', false],\n  ['جاهز', 'jahez', 'delivery', false], ['اوبر', 'uber', 'public_transport', false], ['كريم', 'careem', 'public_transport', false],\n  ['شل', 'shell', 'fuel', false], ['ساسكو', 'sasco', 'fuel', false], ['النهدي', 'nahdi', 'pharmacy', true],\n  ['نتفليكس', 'netflix', 'subscriptions', false], ['سبوتيفاي', 'spotify', 'subscriptions', false],\n];\n\nconst has = (h, stem) => (/^[a-z ]+$/.test(stem) ? new RegExp(`(^|[^a-z])${stem}([^a-z]|$)`).test(h) : h.includes(stem));\nexport const normMerchant = (s) => heavy(light(s)).replace(/\\s+/g, ' ').trim();\n\nexport function findMerchant(text) {\n  const h = ` ${heavy(light(text))} `;\n  for (const [ar, en, key, multi] of MERCHANTS) {\n    if (has(h, en) || new RegExp(`(^|\\\\s|ال)${heavy(ar)}(\\\\s|$)`).test(h)) return { name: ar, en, key, multi };\n  }\n  return null;\n}\n\n// -> { key, confidence, reason, reason_key }   key may be null when nothing matched\nexport function classifyText(text, merchant) {\n  const h = heavy(light(text || ''));\n  const hits = [];\n  for (const [key, stems] of Object.entries(KEYWORDS)) if (stems.some((s) => has(h, heavy(s)))) hits.push(key);\n  const m = merchant ? findMerchant(merchant) : findMerchant(text || '');\n  if (hits.length === 1 && hits[0] !== '_maintenance') {\n    return { key: hits[0], confidence: 0.85, reason: 'keyword', reason_key: 'keyword' };\n  }\n  if (hits.length > 1) {\n    const concrete = hits.filter((k) => k !== '_maintenance');\n    if (concrete.length === 1) return { key: concrete[0], confidence: 0.75, reason: 'keyword', reason_key: 'keyword' };\n    return { key: concrete[0], confidence: 0.5, reason: 'several categories matched', reason_key: 'ambiguous' };\n  }\n  if (hits[0] === '_maintenance') return { key: 'home_maintenance', confidence: 0.45, reason: 'maintenance may be home or car', reason_key: 'ambiguous' };\n  if (m) {\n    return m.multi\n      ? { key: m.key, confidence: 0.5, reason: 'merchant sells many categories', reason_key: 'multi_merchant' }\n      : { key: m.key, confidence: 0.9, reason: 'known merchant', reason_key: 'merchant' };\n  }\n  return { key: null, confidence: 0, reason: 'no match', reason_key: 'none' };\n}\n","server/lib/csv.js":"// CSV import (preview -> mapping -> validated commit with report) and export. Excel files are not supported (export to CSV first).\nimport { tx as dbtx, audit } from '../db.js';\nimport { all, one, run, bad, getProfile } from './base.js';\nimport { normalizeDigits } from './parser.js';\nimport { toMinor, fromMinor, SUPPORTED_CURRENCIES } from './money.js';\nimport { isIsoDate } from './dates.js';\nimport { heavy, light } from './classifier.js';\nimport { normalize, insertNormalized, findDuplicates, classifyForUser } from './tx.js';\n\nexport function parseCSV(text) {\n  const s = String(text).replace(/^﻿/, '');\n  const first = s.split(/\\r?\\n/, 1)[0] ?? '';\n  const delim = [',', ';', '\\t'].map((d) => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];\n  const rows = []; let row = [], cell = '', q = false;\n  for (let i = 0; i \u003c s.length; i++) {\n    const c = s[i];\n    if (q) { if (c === '\"') { if (s[i + 1] === '\"') { cell += '\"'; i++; } else q = false; } else cell += c; }\n    else if (c === '\"') q = true;\n    else if (c === delim) { row.push(cell); cell = ''; }\n    else if (c === '\\n' || c === '\\r') { if (c === '\\r' && s[i + 1] === '\\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }\n    else cell += c;\n  }\n  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }\n  return { delimiter: delim, rows: rows.filter((r) => r.some((x) => x.trim() !== '')) };\n}\n\nconst SYN = {\n  date: ['date', 'transaction date', 'posting date', 'التاريخ', 'تاريخ'],\n  amount: ['amount', 'value', 'المبلغ', 'القيمة'],\n  debit: ['debit', 'withdrawal', 'مدين', 'سحب'], credit: ['credit', 'deposit', 'دائن', 'ايداع'],\n  description: ['description', 'details', 'memo', 'narration', 'الوصف', 'البيان', 'التفاصيل'],\n  type: ['type', 'النوع'], currency: ['currency', 'العملة'], merchant: ['merchant', 'payee', 'vendor', 'التاجر', 'المستفيد'],\n  category: ['category', 'التصنيف', 'الفئة'], reference: ['reference', 'ref', 'id', 'transaction id', 'المرجع', 'رقم العملية'],\n  account: ['account', 'الحساب'],\n};\nexport function detectMapping(headers) {\n  const map = {};\n  headers.forEach((h, i) => { const n = heavy(light(h)).trim(); for (const [f, syns] of Object.entries(SYN)) if (map[f] === undefined && syns.map(heavy).includes(n)) map[f] = i; });\n  return map;\n}\n\nexport function parseAmount(raw) {\n  let s = normalizeDigits(String(raw ?? '')).trim(); if (!s) return null;\n  let neg = false;\n  if (/^\\(.*\\)$/.test(s)) { neg = true; s = s.slice(1, -1); }\n  if (/^-/.test(s) || /-$/.test(s)) { neg = true; s = s.replace(/^-|-$/g, ''); }\n  s = s.replace(/[^\\d.,]/g, '');\n  if (!s) return null;\n  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');\n  if (lc >= 0 && ld >= 0) s = lc > ld ? s.replace(/\\./g, '').replace(',', '.') : s.replace(/,/g, '');\n  else if (lc >= 0) s = /,\\d{1,2}$/.test(s) && (s.match(/,/g) || []).length === 1 ? s.replace(',', '.') : s.replace(/,/g, '');\n  if (!/^\\d+(\\.\\d+)?$/.test(s)) return null;\n  return { value: s, negative: neg };\n}\n\nexport function parseDate(raw, fmt = 'ymd') {\n  const s = normalizeDigits(String(raw ?? '')).trim().slice(0, 10); let m;\n  if ((m = /^(\\d{4})[-/](\\d{1,2})[-/](\\d{1,2})$/.exec(s))) { const iso = `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`; return isIsoDate(iso) ? iso : null; }\n  if ((m = /^(\\d{1,2})[-/.](\\d{1,2})[-/.](\\d{4})$/.exec(s))) {\n    const [a, b] = [m[1], m[2]]; const [d, mo] = fmt === 'mdy' ? [b, a] : [a, b];\n    const iso = `${m[3]}-${mo.padStart(2, '0')}-${d.padStart(2, '0')}`; return isIsoDate(iso) ? iso : null;\n  }\n  return null;\n}\n\nconst IN_TYPES = { income: 'income', expense: 'expense', refund: 'refund', transfer: 'transfer', debt_payment: 'debt_payment', دخل: 'income', مصروف: 'expense', استرداد: 'refund' };\n\nfunction buildRows(db, userId, csv, mapping, opts, profile) {\n  const { rows } = parseCSV(csv);\n  const hasHeader = opts.has_header !== false; const body = hasHeader ? rows.slice(1) : rows;\n  const cats = all(db, 'SELECT id,name_ar,name_en FROM categories WHERE user_id=?', userId);\n  const accts = all(db, 'SELECT id,name,currency FROM accounts WHERE user_id=? AND archived=0', userId);\n  const out = [];\n  body.forEach((r, idx) => {\n    const line = idx + (hasHeader ? 2 : 1); const get = (f) => (mapping[f] !== undefined ? (r[mapping[f]] ?? '').trim() : '');\n    const reject = (reason) => out.push({ line, ok: false, reason, raw: r.slice(0, 12) });\n    const date = parseDate(get('date'), opts.date_format); if (!date) return reject('invalid_date');\n    let type, amountStr;\n    if (mapping.debit !== undefined || mapping.credit !== undefined) {\n      const d = parseAmount(get('debit')), c = parseAmount(get('credit'));\n      if (d && Number(d.value) > 0) { type = 'expense'; amountStr = d.value; } else if (c && Number(c.value) > 0) { type = 'income'; amountStr = c.value; } else return reject('invalid_amount');\n    } else {\n      const a = parseAmount(get('amount')); if (!a || !(Number(a.value) > 0)) return reject('invalid_amount');\n      amountStr = a.value; const t = IN_TYPES[heavy(light(get('type')))] ?? IN_TYPES[get('type').toLowerCase()];\n      type = t ?? (a.negative ? 'expense' : (opts.positive_is === 'expense' ? 'expense' : 'income'));\n      if (t === undefined && !get('type') && opts.positive_is === undefined) type = a.negative ? 'expense' : 'income';\n    }\n    const currency = (get('currency') || opts.default_currency || profile.currency).toUpperCase();\n    if (!SUPPORTED_CURRENCIES.includes(currency)) return reject('unsupported_currency');\n    let account_id = opts.default_account_id ? Number(opts.default_account_id) : null;\n    const an = get('account'); if (an) { const a = accts.find((x) => heavy(x.name) === heavy(an)); if (a) account_id = a.id; }\n    const catName = get('category'); let category_id = null;\n    if (catName) { const c = cats.find((x) => heavy(x.name_ar) === heavy(catName) || heavy(x.name_en) === heavy(catName)); category_id = c?.id ?? null; }\n    const description = get('description').slice(0, 300), merchant = get('merchant') || null;\n    if (!category_id && type !== 'transfer') category_id = classifyForUser(db, userId, { description, merchant }).category_id ?? null;\n    out.push({ line, ok: true, input: { type, amount: amountStr, currency, date, description, merchant, category_id, account_id, external_ref: get('reference') || null, source: 'import', status: category_id ? 'confirmed' : 'review' } });\n  });\n  return out;\n}\n\nfunction validateRows(db, userId, rows, profile, jobId = null) {\n  for (const r of rows) {\n    if (!r.ok) continue;\n    try {\n      const n = normalize(db, userId, r.input, profile); r.norm = n;\n      const mname = n.merchant_id ? one(db, 'SELECT name FROM merchants WHERE id=?', n.merchant_id)?.name : null;\n      // only transactions that existed BEFORE this import count as duplicates (repeated rows inside one file are legitimate)\n      const d = findDuplicates(db, userId, { ...n, merchant_name: mname }).filter((x) => x.import_job_id !== jobId || jobId === null);\n      r.duplicates = d; r.is_duplicate = d.some((x) => x.score >= 0.9);\n    } catch (e) { r.ok = false; r.reason = e.code ?? e.message; delete r.input; }\n  }\n  return rows;\n}\n\nexport function previewImport(db, userId, csv, mapping, opts = {}) {\n  const profile = getProfile(db, userId);\n  const { rows, delimiter } = parseCSV(csv);\n  if (!rows.length) throw bad('empty_file');\n  const headers = opts.has_header === false ? rows[0].map((_, i) => `col${i + 1}`) : rows[0];\n  const map = mapping && Object.keys(mapping).length ? mapping : detectMapping(headers);\n  if (map.date === undefined || (map.amount === undefined && map.debit === undefined && map.credit === undefined)) return { headers, mapping: map, delimiter, needs_mapping: true, sample: rows.slice(1, 6) };\n  const built = validateRows(db, userId, buildRows(db, userId, csv, map, opts, profile), profile);\n  const stat = { total: built.length, valid: built.filter((r) => r.ok && !r.is_duplicate).length, duplicates: built.filter((r) => r.ok && r.is_duplicate).length, rejected: built.filter((r) => !r.ok).length };\n  return { headers, mapping: map, delimiter, needs_mapping: false, stats: stat, rows: built.slice(0, 200).map(({ norm, input, ...r }) => ({ ...r, preview: input ? { ...input } : undefined })), truncated: built.length > 200,\n    notice: 'import_is_not_full_ledger' };\n}\n\nexport function commitImport(db, userId, csv, mapping, opts = {}, filename = 'import.csv') {\n  const profile = getProfile(db, userId);\n  const { rows } = parseCSV(csv); const map = mapping && Object.keys(mapping).length ? mapping : detectMapping(opts.has_header === false ? [] : rows[0]);\n  if (map.date === undefined) throw bad('mapping_required');\n  if (rows.length > 20001) throw bad('file_too_large');\n  return dbtx(db, () => {\n    const jobId = Number(run(db, 'INSERT INTO import_jobs (user_id, filename) VALUES (?,?)', userId, String(filename).slice(0, 200)).lastInsertRowid);\n    const built = validateRows(db, userId, buildRows(db, userId, csv, map, opts, profile), profile, jobId);\n    const report = []; let accepted = 0, rejected = 0, skipped = 0;\n    for (const r of built) {\n      if (!r.ok) { rejected++; report.push({ line: r.line, status: 'rejected', reason: r.reason }); continue; }\n      if (r.is_duplicate && opts.skip_duplicates !== false) { skipped++; report.push({ line: r.line, status: 'skipped_duplicate', matches: r.duplicates[0]?.id }); continue; }\n      r.norm.import_job_id = jobId;\n      const id = insertNormalized(db, userId, r.norm, { learnFrom: false }); accepted++; report.push({ line: r.line, status: 'accepted', id });\n    }\n    run(db, 'UPDATE import_jobs SET total=?, accepted=?, rejected=?, report=? WHERE id=?', built.length, accepted, rejected + skipped, JSON.stringify(report), jobId);\n    audit(db, userId, 'import_job', jobId, 'import', null, { accepted, rejected, skipped });\n    return { job_id: jobId, total: built.length, accepted, rejected, skipped_duplicates: skipped, report, imported_at: new Date().toISOString(), source: filename };\n  });\n}\n\n// ---------- export ----------\nconst safe = (v) => { const s = String(v ?? ''); return /^[=+\\-@\\t\\r]/.test(s) ? `'${s}` : s; }; // CSV/formula injection guard\nconst q = (v) => { const s = String(v ?? ''); return /[\",\\n\\r;]/.test(s) ? `\"${s.replace(/\"/g, '\"\"')}\"` : s; };\nexport function exportTransactionsCSV(db, userId, f = {}) {\n  const w = ['t.user_id=?', 't.deleted_at IS NULL']; const p = [userId];\n  if (f.from) { w.push('t.date>=?'); p.push(f.from); } if (f.to) { w.push('t.date\u003c=?'); p.push(f.to); }\n  const rows = all(db, `SELECT t.*, m.name merchant, c.name_en category, a.name account FROM transactions t LEFT JOIN merchants m ON m.id=t.merchant_id LEFT JOIN categories c ON c.id=t.category_id LEFT JOIN accounts a ON a.id=t.account_id WHERE ${w.join(' AND ')} ORDER BY t.date, t.id`, ...p);\n  const head = ['id', 'date', 'type', 'amount', 'currency', 'description', 'merchant', 'category', 'account', 'payment_method', 'tags', 'status', 'source', 'reference'];\n  const lines = [head.join(',')];\n  for (const r of rows) lines.push([r.id, r.date, r.type, fromMinor(r.amount, r.currency), r.currency, safe(r.description), safe(r.merchant), safe(r.category), safe(r.account), r.payment_method ?? '', safe(JSON.parse(r.tags).join(' ')), r.status, r.source, safe(r.external_ref)].map(q).join(','));\n  return '﻿' + lines.join('\\r\\n') + '\\r\\n';\n}\n","server/lib/dates.js":"// Dates are plain ISO strings (YYYY-MM-DD) in the user's timezone; arithmetic is done in UTC.\nconst DAY = 86400000;\nconst parse = (iso) => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };\nconst fmt = (ms) => new Date(ms).toISOString().slice(0, 10);\n\nexport const isIsoDate = (s) => {\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(s || '')) return false;\n  return fmt(parse(s)) === s;\n};\nexport function todayIn(tz = 'Asia/Riyadh', now = new Date()) {\n  try { return new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(now); }\n  catch { return new Intl.DateTimeFormat('en-CA', { timeZone: 'UTC' }).format(now); }\n}\nexport const addDays = (iso, n) => fmt(parse(iso) + n * DAY);\nexport const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / DAY); // b - a\nexport const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate(); // m is 1-based\nexport function addMonths(iso, n, anchorDay) {\n  const [y, m, d] = iso.split('-').map(Number);\n  const t = y * 12 + (m - 1) + n;\n  const ny = Math.floor(t / 12), nm = (t % 12) + 1;\n  const day = Math.min(anchorDay || d, daysInMonth(ny, nm));\n  return `${ny}-${String(nm).padStart(2, '0')}-${String(day).padStart(2, '0')}`;\n}\nexport const weekday = (iso) => new Date(parse(iso)).getUTCDay(); // 0 = Sunday\n\n// Financial month starting on `startDay` (1..28). Returns inclusive [start,end].\nexport function monthPeriod(iso, startDay = 1) {\n  const [y, m, d] = iso.split('-').map(Number);\n  const first = d >= startDay ? `${y}-${String(m).padStart(2, '0')}-${String(startDay).padStart(2, '0')}`\n    : addMonths(`${y}-${String(m).padStart(2, '0')}-01`, -1, startDay);\n  const start = first.slice(0, 8) + String(startDay).padStart(2, '0');\n  const end = addDays(addMonths(start, 1, startDay), -1);\n  return { start, end };\n}\nexport function weekPeriod(iso) { const s = addDays(iso, -weekday(iso)); return { start: s, end: addDays(s, 6) }; }\nexport function yearPeriod(iso) { const y = iso.slice(0, 4); return { start: `${y}-01-01`, end: `${y}-12-31` }; }\n\nexport function periodFor(kind, iso, startDay = 1) {\n  if (kind === 'week' || kind === 'weekly') return weekPeriod(iso);\n  if (kind === 'year' || kind === 'yearly') return yearPeriod(iso);\n  return monthPeriod(iso, startDay);\n}\nexport function previousPeriod(kind, p, startDay = 1) {\n  if (kind === 'week' || kind === 'weekly') return weekPeriod(addDays(p.start, -1));\n  if (kind === 'year' || kind === 'yearly') return yearPeriod(addDays(p.start, -1));\n  return monthPeriod(addDays(p.start, -1), startDay);\n}\nexport const periodDays = (p) => diffDays(p.start, p.end) + 1;\n","server/lib/demo.js":"// Clearly-labelled SYNTHETIC demo ledger (profile.is_demo = 1 shows a banner in the UI).\nimport { run, getProfile, categoryIdByKey } from './base.js';\nimport { addDays, addMonths, monthPeriod } from './dates.js';\nimport { createTransaction } from './tx.js';\nimport { toMinor } from './money.js';\n\nexport function seedDemoData(db, uid) {\n  let seed = 42; const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };\n  const between = (a, b) => Math.round(a + rnd() * (b - a));\n  run(db, 'UPDATE profiles SET is_demo=1 WHERE user_id=?', uid);\n  const profile = getProfile(db, uid); const c = (k) => categoryIdByKey(db, uid, k);\n  const acct = (name, type, opening, limit) => Number(run(db, 'INSERT INTO accounts (user_id,name,type,currency,opening_balance,credit_limit) VALUES (?,?,?,?,?,?)', uid, name, type, 'SAR', toMinor(opening, 'SAR'), limit ? toMinor(limit, 'SAR') : null).lastInsertRowid);\n  const bank = acct('Demo Bank', 'bank', '8000'), cash = acct('Demo Cash', 'cash', '600'), card = acct('Demo Card', 'credit_card', '0', '10000');\n  const put = (o) => createTransaction(db, uid, { currency: 'SAR', ...o }, profile, { force: true });\n  const start = monthPeriod(profile.today, 1).start;\n  for (let m = 3; m >= 0; m--) {\n    const first = addMonths(start, -m, 1);\n    const when = (d) => { const x = addDays(first, d - 1); return x > profile.today ? null : x; };\n    const plan = [\n      [1, { type: 'income', amount: '12000', account_id: bank, category_id: c('salary'), description: 'Demo salary' }],\n      [2, { type: 'expense', amount: '2500', account_id: bank, category_id: c('rent'), description: 'Demo rent' }],\n      [6, { type: 'expense', amount: String(between(280, 420)), account_id: bank, category_id: c('electricity'), description: 'Electricity' }],\n      [8, { type: 'expense', amount: '55', account_id: card, category_id: c('subscriptions'), description: 'Streaming', merchant: 'Netflix' }],\n      [9, { type: 'transfer', amount: '1500', account_id: bank, to_account_id: cash, description: 'Cash withdrawal' }],\n      [12, { type: 'expense', amount: '1000', account_id: bank, category_id: c('savings'), description: 'Monthly investing' }],\n    ];\n    for (let d = 2; d \u003c= 28; d += 3) {\n      plan.push([d, { type: 'expense', amount: String(between(30, 90)), account_id: cash, category_id: c('restaurants'), description: 'Lunch' }]);\n      plan.push([d + 1, { type: 'expense', amount: String(between(12, 25)), account_id: cash, category_id: c('coffee'), description: 'Coffee', merchant: 'Demo Cafe' }]);\n      if (d % 6 === 2) plan.push([d, { type: 'expense', amount: String(between(180, 420)), account_id: card, category_id: c('groceries'), description: 'Groceries', merchant: 'Demo Market' }]);\n      if (d % 9 === 2) plan.push([d, { type: 'expense', amount: String(between(100, 180)), account_id: card, category_id: c('fuel'), description: 'Fuel', merchant: 'Demo Fuel' }]);\n    }\n    for (const [d, o] of plan) { const date = when(d); if (date) put({ ...o, date }); }\n  }\n  const bud = (cat, amt) => run(db, 'INSERT INTO budgets (user_id,category_id,period,amount,currency) VALUES (?,?,?,?,?)', uid, cat, 'monthly', toMinor(amt, 'SAR'), 'SAR');\n  bud(c('food'), '1500'); bud(c('transport'), '500'); bud(null, '7000');\n  const rec = (name, amt, acc, cat, day, due) => run(db, 'INSERT INTO recurring_rules (user_id,name,type,amount,currency,account_id,category_id,frequency,anchor_day,next_due) VALUES (?,?,?,?,?,?,?,?,?,?)', uid, name, 'expense', toMinor(amt, 'SAR'), 'SAR', acc, cat, 'monthly', day, due);\n  rec('Demo rent', '2500', bank, c('rent'), 2, addMonths(start, 1, 2)); rec('Streaming', '55', card, c('subscriptions'), 8, addDays(profile.today, 3));\n  const g = Number(run(db, 'INSERT INTO savings_goals (user_id,name,target,currency,target_date) VALUES (?,?,?,?,?)', uid, 'Emergency fund', toMinor('30000', 'SAR'), 'SAR', addDays(profile.today, 300)).lastInsertRowid);\n  run(db, 'INSERT INTO goal_contributions (goal_id,user_id,amount,date) VALUES (?,?,?,?)', g, uid, toMinor('4000', 'SAR'), addDays(profile.today, -40));\n  run(db, 'INSERT INTO goal_contributions (goal_id,user_id,amount,date) VALUES (?,?,?,?)', g, uid, toMinor('1500', 'SAR'), addDays(profile.today, -10));\n}\n","server/lib/finance.js":"// Financial calculations. All amounts here are integer minor units of a single currency unless noted.\n// Definitions (documented in README):\n//   expenses       = type expense, category kind \u003c> saving\n//   refunds        = type refund (reduce spending in their category)\n//   net_spend      = expenses - refunds\n//   savings        = type expense in a 'saving' category (money set aside, not consumption)\n//   debt_payments  = type debt_payment (principal repayment, not consumption)\n//   net_cashflow   = income - net_spend - savings - debt_payments\n//   transfers      = never counted anywhere above\nimport { all, one, categoryTree, categoryScope } from './base.js';\nimport { exponent } from './money.js';\nimport { addDays, addMonths, diffDays, monthPeriod, periodFor, previousPeriod, periodDays, todayIn } from './dates.js';\n\n// ---------- fx ----------\nexport function rateFor(db, userId, from, to, date) {\n  if (from === to) return 1;\n  const r = one(db, 'SELECT rate FROM fx_rates WHERE user_id=? AND from_currency=? AND to_currency=? AND date\u003c=? ORDER BY date DESC LIMIT 1', userId, from, to, date);\n  if (r) return Number(r.rate);\n  const inv = one(db, 'SELECT rate FROM fx_rates WHERE user_id=? AND from_currency=? AND to_currency=? AND date\u003c=? ORDER BY date DESC LIMIT 1', userId, to, from, date);\n  return inv ? 1 / Number(inv.rate) : null;\n}\nconst convertMinor = (amt, from, to, rate) => Math.round(amt * rate * 10 ** (exponent(to) - exponent(from)));\n\n// ---------- line source ----------\nfunction lines(db, userId, { from, to, account_id, category_ids }) {\n  const w = [\"t.user_id=?\", 't.deleted_at IS NULL', \"t.type\u003c>'transfer'\", 't.date BETWEEN ? AND ?']; const p = [userId, from, to];\n  if (account_id) { w.push('t.account_id=?'); p.push(Number(account_id)); }\n  const rows = all(db, `SELECT t.id, t.date, t.type, t.currency, t.account_id, t.merchant_id, m.name AS merchant_name, t.description, t.recurring_rule_id, t.status,\n      COALESCE(s.category_id, t.category_id) AS category_id, COALESCE(s.amount, t.amount) AS amount, c.kind AS cat_kind\n    FROM transactions t LEFT JOIN transaction_splits s ON s.transaction_id=t.id\n    LEFT JOIN categories c ON c.id=COALESCE(s.category_id, t.category_id) LEFT JOIN merchants m ON m.id=t.merchant_id\n    WHERE ${w.join(' AND ')}`, ...p);\n  if (!category_ids) return rows;\n  const set = new Set(category_ids); return rows.filter((r) => set.has(r.category_id));\n}\nconst bucket = (r) => r.type === 'income' ? 'income' : r.type === 'refund' ? 'refunds' : r.type === 'debt_payment' ? 'debt_payments' : r.cat_kind === 'saving' ? 'savings' : 'expenses';\n\nexport function summary(db, userId, { from, to, currency, account_id, category_id, convert = false }) {\n  const category_ids = category_id ? categoryScope(db, userId, category_id) : null;\n  const rows = lines(db, userId, { from, to, account_id, category_ids });\n  const tot = { income: 0, expenses: 0, refunds: 0, savings: 0, debt_payments: 0 };\n  const cat = new Map(), merch = new Map(), daily = new Map(), acct = new Map(), others = new Map();\n  const txIds = new Set(); let unconverted = 0, converted = 0, review = 0;\n  const reviewIds = new Set();\n  for (const r of rows) {\n    let amt = r.amount;\n    if (r.currency !== currency) {\n      const o = others.get(r.currency) ?? { currency: r.currency, income: 0, expenses: 0, count: 0 };\n      if (r.type === 'income') o.income += amt; else if (r.type === 'expense') o.expenses += amt;\n      o.count++; others.set(r.currency, o);\n      const rate = convert ? rateFor(db, userId, r.currency, currency, r.date) : null;\n      if (!rate) { if (convert) unconverted++; continue; }\n      amt = convertMinor(amt, r.currency, currency, rate); converted++;\n    }\n    txIds.add(r.id); if (r.status === 'review') reviewIds.add(r.id);\n    const b = bucket(r); tot[b] += amt;\n    if (b === 'expenses' || b === 'refunds' || b === 'savings') {\n      const sign = b === 'refunds' ? -1 : 1;\n      const k = r.category_id ?? 0; cat.set(k, (cat.get(k) ?? 0) + sign * amt);\n      if (b !== 'savings') {\n        daily.set(r.date, (daily.get(r.date) ?? 0) + sign * amt);\n        if (r.merchant_id && b === 'expenses') { const m = merch.get(r.merchant_id) ?? { merchant_id: r.merchant_id, name: r.merchant_name, amount: 0, count: 0 }; m.amount += amt; m.count++; merch.set(r.merchant_id, m); }\n        const ak = r.account_id ?? 0; acct.set(ak, (acct.get(ak) ?? 0) + sign * amt);\n      }\n    }\n  }\n  const net_spend = tot.expenses - tot.refunds;\n  const tree = categoryTree(db, userId);\n  // roll leaf categories up to their top-level parent\n  const top = new Map();\n  for (const [id, amount] of cat) {\n    const c = tree.byId.get(id); const root = c ? (c.parent_id ? tree.byId.get(c.parent_id) : c) : null; const rid = root?.id ?? 0;\n    const e = top.get(rid) ?? { category_id: rid, amount: 0, children: [] }; e.amount += amount;\n    e.children.push({ category_id: id, amount }); top.set(rid, e);\n  }\n  const days = []; for (let d = from; d \u003c= to && days.length \u003c 800; d = addDays(d, 1)) days.push({ date: d, amount: daily.get(d) ?? 0 });\n  return {\n    currency, from, to, ...tot, net_spend, net_cashflow: tot.income - net_spend - tot.savings - tot.debt_payments,\n    tx_count: txIds.size, review_count: reviewIds.size,\n    by_category: [...cat].map(([category_id, amount]) => ({ category_id, amount })).filter((x) => x.amount !== 0).sort((a, b) => b.amount - a.amount),\n    by_top_category: [...top.values()].filter((x) => x.amount !== 0).sort((a, b) => b.amount - a.amount),\n    by_merchant: [...merch.values()].sort((a, b) => b.amount - a.amount).slice(0, 10),\n    by_account: [...acct].map(([account_id, amount]) => ({ account_id: account_id || null, amount })).sort((a, b) => b.amount - a.amount),\n    daily: days, other_currencies: [...others.values()], fx: convert ? { converted, unconverted } : null,\n  };\n}\n\n// ---------- accounts ----------\nexport function accountBalances(db, userId) {\n  const accts = all(db, 'SELECT * FROM accounts WHERE user_id=? ORDER BY archived, id', userId);\n  const bal = new Map(accts.map((a) => [a.id, a.opening_balance]));\n  const rows = all(db, \"SELECT account_id,to_account_id,type,amount,to_amount FROM transactions WHERE user_id=? AND deleted_at IS NULL\", userId);\n  for (const t of rows) {\n    if (t.account_id !== null && bal.has(t.account_id)) {\n      const sign = t.type === 'income' || t.type === 'refund' ? 1 : -1; // expense, debt_payment, transfer(out) are negative\n      bal.set(t.account_id, bal.get(t.account_id) + sign * t.amount);\n    }\n    if (t.type === 'transfer' && t.to_account_id !== null && bal.has(t.to_account_id)) bal.set(t.to_account_id, bal.get(t.to_account_id) + (t.to_amount ?? t.amount));\n  }\n  return accts.map((a) => ({\n    ...a, balance: bal.get(a.id), balance_basis: a.verified_at ? 'tracked_with_checkpoint' : 'tracked',\n    available_credit: a.type === 'credit_card' && a.credit_limit != null ? a.credit_limit + bal.get(a.id) : null,\n  }));\n}\n\n// ---------- recurring ----------\nexport function nextDate(rule, from = rule.next_due) {\n  const n = rule.interval_n || 1;\n  if (rule.frequency === 'weekly') return addDays(from, 7 * n);\n  if (rule.frequency === 'monthly') return addMonths(from, n, rule.anchor_day);\n  return addMonths(from, 12 * n, rule.anchor_day);\n}\nexport function occurrencesUntil(rule, end) {\n  const out = []; let d = rule.next_due;\n  for (let i = 0; d \u003c= end && i \u003c 400; i++) { out.push(d); d = nextDate(rule, d); }\n  return out;\n}\nexport function recurringStatus(db, userId, today) {\n  return all(db, 'SELECT * FROM recurring_rules WHERE user_id=? ORDER BY active DESC, next_due', userId).map((r) => {\n    const days = diffDays(today, r.next_due);\n    const status = !r.active ? 'paused' : days \u003c 0 ? 'overdue' : days === 0 ? 'due_today' : days \u003c= r.remind_days ? 'upcoming' : 'scheduled';\n    return { ...r, days_until: days, status };\n  });\n}\nfunction pendingObligations(db, userId, currency, end) {\n  const rules = all(db, \"SELECT * FROM recurring_rules WHERE user_id=? AND active=1 AND currency=? AND type IN ('expense','debt_payment')\", userId, currency);\n  let total = 0; const items = [];\n  for (const r of rules) { const occ = occurrencesUntil(r, end); if (occ.length) { total += occ.length * r.amount; items.push({ rule_id: r.id, name: r.name, category_id: r.category_id, count: occ.length, amount: occ.length * r.amount, first_due: occ[0] }); } }\n  return { total, items };\n}\n\n// ---------- budgets ----------\nexport function budgetStatus(db, userId, profile, ref = profile.today) {\n  const budgets = all(db, 'SELECT * FROM budgets W
