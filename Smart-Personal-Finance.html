HERE user_id=? ORDER BY category_id IS NOT NULL, id', userId);\n  const spentIn = (b, p) => {\n    const ids = b.category_id ? categoryScope(db, userId, b.category_id) : null;\n    const rows = lines(db, userId, { from: p.start, to: p.end, category_ids: ids }).filter((r) => r.currency === b.currency);\n    let s = 0;\n    for (const r of rows) {\n      if (r.type === 'refund') s -= r.amount;\n      else if (r.type === 'expense' && (b.category_id || r.cat_kind !== 'saving')) s += r.amount;\n    }\n    return s;\n  };\n  return budgets.map((b) => {\n    const p = periodFor(b.period, ref, profile.month_start_day);\n    const spent = spentIn(b, p);\n    let carry = 0;\n    if (b.rollover) { const pp = previousPeriod(b.period, p, profile.month_start_day); carry = Math.max(0, b.amount - spentIn(b, pp)); }\n    const limit = b.amount + carry;\n    const total = periodDays(p), elapsed = Math.min(total, Math.max(1, diffDays(p.start, ref) + 1));\n    const thresholds = JSON.parse(b.thresholds || '[80,100]');\n    const pct = limit ? (spent / limit) * 100 : 0;\n    const forecast = elapsed >= 3 && ref \u003c= p.end ? Math.round((spent / elapsed) * total) : null;\n    const hit = thresholds.filter((t) => pct >= t);\n    return { ...b, thresholds, period_start: p.start, period_end: p.end, carry, limit, spent, remaining: limit - spent, pct: Math.round(pct * 10) / 10,\n      forecast, projected_over: forecast !== null && forecast > limit, status: pct >= 100 ? 'over' : hit.length ? 'warning' : 'ok', crossed: hit.length ? Math.max(...hit) : null };\n  });\n}\n\n// ---------- forecast ----------\nexport function forecastMonth(db, userId, profile, currency = profile.currency) {\n  const p = monthPeriod(profile.today, profile.month_start_day);\n  const total = periodDays(p), elapsed = diffDays(p.start, profile.today) + 1, remaining = total - elapsed;\n  const rows = lines(db, userId, { from: p.start, to: profile.today }).filter((r) => r.currency === currency);\n  let actual = 0, variable = 0; const dayVar = new Map(); const ids = new Set();\n  for (const r of rows) {\n    const sign = r.type === 'refund' ? -1 : r.type === 'expense' && r.cat_kind !== 'saving' ? 1 : 0; if (!sign) continue;\n    actual += sign * r.amount; ids.add(r.id);\n    if (!r.recurring_rule_id) { variable += sign * r.amount; dayVar.set(r.date, (dayVar.get(r.date) ?? 0) + sign * r.amount); }\n  }\n  const pending = pendingObligations(db, userId, currency, p.end);\n  const base = { currency, period: p, elapsed_days: elapsed, remaining_days: remaining, total_days: total, actual_so_far: actual, pending_recurring: pending.total, tx_count: ids.size };\n  if (elapsed \u003c 7 || ids.size \u003c 5) return { ...base, confidence: 'insufficient', projected: null, reason: 'not_enough_data' };\n  const avg = variable / elapsed; const vals = []; for (let i = 0; i \u003c elapsed; i++) vals.push(dayVar.get(addDays(p.start, i)) ?? 0);\n  const mean = vals.reduce((a, b) => a + b, 0) / vals.length; const sd = Math.sqrt(vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length);\n  const projected = Math.round(actual + avg * remaining + pending.total);\n  const band = Math.round(sd * Math.sqrt(Math.max(remaining, 0)));\n  const confidence = elapsed >= 15 && ids.size >= 20 ? 'high' : elapsed >= 7 && ids.size >= 10 ? 'medium' : 'low';\n  return { ...base, confidence, projected, low: Math.max(actual, projected - band), high: projected + band, daily_variable_avg: Math.round(avg),\n    assumptions: ['variable_run_rate', 'pending_recurring_added', 'no_unrecorded_income_or_spend'] };\n}\n\n// ---------- goals ----------\nexport function goalsStatus(db, userId, profile) {\n  const goals = all(db, 'SELECT * FROM savings_goals WHERE user_id=? ORDER BY archived, id', userId);\n  return goals.map((g) => {\n    const saved = one(db, 'SELECT COALESCE(SUM(amount),0) s FROM goal_contributions WHERE goal_id=? AND user_id=?', g.id, userId).s;\n    const since = addDays(profile.today, -90);\n    const recent = one(db, 'SELECT COALESCE(SUM(amount),0) s FROM goal_contributions WHERE goal_id=? AND user_id=? AND date>=?', g.id, userId, since).s;\n    const remaining = Math.max(0, g.target - saved);\n    let months_left = null, required_monthly = null, overdue = false;\n    if (g.target_date) {\n      const d = diffDays(profile.today, g.target_date);\n      if (d \u003c= 0) overdue = remaining > 0; else { months_left = Math.max(1, Math.ceil(d / 30.4375)); required_monthly = Math.ceil(remaining / months_left); }\n    }\n    const monthly_pace = Math.round(recent / 3);\n    const eta_months = remaining === 0 ? 0 : monthly_pace > 0 ? Math.ceil(remaining / monthly_pace) : null;\n    return { ...g, saved, remaining, progress: Math.min(100, Math.round((saved / g.target) * 1000) / 10), completed: remaining === 0, months_left, required_monthly, overdue, monthly_pace, eta_months };\n  });\n}\n\n// ---------- safe to spend ----------\nexport function safeToSpend(db, userId, profile, currency = profile.currency, overrides = {}) {\n  const prefs = { ...profile.safe_prefs, ...overrides };\n  const p = monthPeriod(profile.today, profile.month_start_day);\n  const accts = accountBalances(db, userId).filter((a) => !a.archived && a.currency === currency && ['cash', 'bank', 'wallet'].includes(a.type));\n  const spendable = accts.reduce((s, a) => s + a.balance, 0);\n  const pending = pendingObligations(db, userId, currency, p.end);\n  let goalsReserve = 0;\n  if (prefs.reserve_goals) for (const g of goalsStatus(db, userId, profile)) if (g.currency === currency && !g.archived && g.required_monthly) {\n    const thisMonth = one(db, 'SELECT COALESCE(SUM(amount),0) s FROM goal_contributions WHERE goal_id=? AND user_id=? AND date BETWEEN ? AND ?', g.id, userId, p.start, p.end).s;\n    goalsReserve += Math.max(0, Math.min(g.remaining, g.required_monthly - thisMonth));\n  }\n  let budgetsReserve = 0;\n  if (prefs.reserve_budgets) {\n    // reserve what is left of category budgets, minus recurring bills already counted in obligations (no double counting)\n    for (const b of budgetStatus(db, userId, profile).filter((x) => x.category_id && x.period === 'monthly' && x.currency === currency)) {\n      const scope = new Set(categoryScope(db, userId, b.category_id));\n      const inObl = pending.items.filter((i) => scope.has(i.category_id)).reduce((s, i) => s + i.amount, 0);\n      budgetsReserve += Math.max(0, b.remaining - inObl);\n    }\n  }\n  const safe = spendable - pending.total - goalsReserve - budgetsReserve;\n  return { currency, period: p, safe, spendable_balance: spendable, accounts_used: accts.map((a) => ({ id: a.id, name: a.name, balance: a.balance, verified: !!a.verified_at })),\n    obligations_due: pending.total, obligations: pending.items, goals_reserve: goalsReserve, budgets_reserve: budgetsReserve, prefs,\n    formula: 'safe = spendable_balance - obligations_due - goals_reserve - budgets_reserve', basis: 'tracked_balances_not_bank_verified',\n    note: 'credit cards excluded; expected income not counted' };\n}\n\n// ---------- anomalies ----------\nexport function anomalies(db, userId, profile) {\n  const out = []; const today = profile.today;\n  const recent = all(db, \"SELECT t.id,t.amount,t.currency,t.date,t.description,t.category_id FROM transactions t WHERE t.user_id=? AND t.deleted_at IS NULL AND t.type='expense' AND t.date>=? AND t.category_id IS NOT NULL\", userId, addDays(today, -30));\n  for (const r of recent) {\n    const hist = all(db, \"SELECT amount FROM transactions WHERE user_id=? AND deleted_at IS NULL AND type='expense' AND category_id=? AND currency=? AND date\u003c? AND date>=? AND id\u003c>?\", userId, r.category_id, r.currency, r.date, addDays(r.date, -180), r.id).map((x) => x.amount);\n    if (hist.length \u003c 5) continue;\n    const mean = hist.reduce((a, b) => a + b, 0) / hist.length; const sd = Math.sqrt(hist.reduce((a, b) => a + (b - mean) ** 2, 0) / hist.length);\n    if (r.amount > mean + 3 * sd && r.amount > 1.5 * mean) out.push({ kind: 'high_amount', transaction_id: r.id, amount: r.amount, currency: r.currency, typical: Math.round(mean), description: r.description, date: r.date });\n  }\n  for (const r of all(db, 'SELECT * FROM recurring_rules WHERE user_id=? AND active=1 AND last_paid_amount IS NOT NULL AND last_paid_amount\u003c>amount', userId)) {\n    out.push({ kind: 'amount_changed', rule_id: r.id, name: r.name, currency: r.currency, previous: r.last_paid_amount, expected: r.amount });\n  }\n  const dup = all(db, `SELECT date, amount, currency, description, COUNT(*) c FROM transactions WHERE user_id=? AND deleted_at IS NULL AND type='expense' AND date>=? GROUP BY date, amount, currency, description HAVING c>1`, userId, addDays(today, -30));\n  for (const d of dup) out.push({ kind: 'possible_duplicate', date: d.date, amount: d.amount, currency: d.currency, description: d.description, count: d.c });\n  // month-to-date pace vs previous period over the same number of elapsed days\n  const p = monthPeriod(today, profile.month_start_day), pp = previousPeriod('monthly', p, profile.month_start_day);\n  const elapsed = diffDays(p.start, today);\n  const cur = summary(db, userId, { from: p.start, to: today, currency: profile.currency }).net_spend;\n  const prev = summary(db, userId, { from: pp.start, to: addDays(pp.start, elapsed), currency: profile.currency }).net_spend;\n  if (elapsed >= 7 && prev > 0 && cur > prev * 1.3) out.push({ kind: 'pace_high', current: cur, previous: prev, currency: profile.currency, pct: Math.round((cur / prev - 1) * 100) });\n  return out;\n}\n\n// ---------- alerts (computed on demand, honour user preferences) ----------\nexport function alerts(db, userId, profile) {\n  const pr = profile.notif_prefs; const out = [];\n  if (pr.budget) for (const b of budgetStatus(db, userId, profile)) {\n    if (b.status !== 'ok') out.push({ kind: 'budget', severity: b.status === 'over' ? 'danger' : 'warning', params: { budget_id: b.id, category_id: b.category_id, pct: Math.round(b.pct), threshold: b.crossed, currency: b.currency, remaining: b.remaining } });\n    else if (b.projected_over) out.push({ kind: 'budget_projected', severity: 'info', params: { budget_id: b.id, category_id: b.category_id, forecast: b.forecast, limit: b.limit, currency: b.currency } });\n  }\n  if (pr.due) for (const r of recurringStatus(db, userId, profile.today)) if (['overdue', 'due_today', 'upcoming'].includes(r.status) && r.type !== 'income') out.push({ kind: 'due', severity: r.status === 'overdue' ? 'danger' : 'warning', params: { rule_id: r.id, name: r.name, amount: r.amount, currency: r.currency, days: r.days_until, status: r.status } });\n  if (pr.low_balance) {\n    const s = safeToSpend(db, userId, profile);\n    if (s.accounts_used.length && s.safe \u003c 0) out.push({ kind: 'low_balance', severity: 'danger', params: { safe: s.safe, currency: s.currency } });\n  }\n  if (pr.anomaly) for (const a of anomalies(db, userId, profile)) out.push({ kind: `anomaly_${a.kind}`, severity: 'info', params: a });\n  if (pr.goal) for (const g of goalsStatus(db, userId, profile)) {\n    if (g.completed || g.archived) continue;\n    if (g.required_monthly && g.monthly_pace > g.required_monthly * 1.2) out.push({ kind: 'goal_ahead', severity: 'info', params: { goal_id: g.id, name: g.name, eta_months: g.eta_months, months_left: g.months_left } });\n    if (g.overdue) out.push({ kind: 'goal_overdue', severity: 'warning', params: { goal_id: g.id, name: g.name } });\n  }\n  return out;\n}\n\n// ---------- what-if ----------\nexport function whatIf(db, userId, profile, { purchase = 0, extra_saving = 0, cut_category_id = null, cut_pct = 0, currency = profile.currency }) {\n  const base = safeToSpend(db, userId, profile, currency);\n  const fc = forecastMonth(db, userId, profile, currency);\n  let cutMonthly = 0;\n  if (cut_category_id && cut_pct > 0) {\n    const p = monthPeriod(profile.today, profile.month_start_day); const pp1 = previousPeriod('monthly', p, profile.month_start_day);\n    const pp2 = previousPeriod('monthly', pp1, profile.month_start_day); const pp3 = previousPeriod('monthly', pp2, profile.month_start_day);\n    const vals = [pp1, pp2, pp3].map((x) => summary(db, userId, { from: x.start, to: x.end, currency, category_id: cut_category_id }).net_spend);\n    cutMonthly = Math.round(((vals[0] + vals[1] + vals[2]) / 3) * (cut_pct / 100));\n  }\n  const frac = fc.total_days ? fc.remaining_days / fc.total_days : 0;\n  const safeAfter = base.safe - purchase - Math.round(extra_saving * frac) + Math.round(cutMonthly * frac);\n  const goals = goalsStatus(db, userId, profile).filter((g) => g.currency === currency && !g.completed && !g.archived).map((g) => {\n    const monthly = g.monthly_pace + extra_saving;\n    return { goal_id: g.id, name: g.name, eta_months_before: g.eta_months, eta_months_after: monthly > 0 ? Math.ceil(g.remaining / monthly) : null };\n  });\n  return { currency, purchase, extra_saving, cut_monthly_effect: cutMonthly, safe_before: base.safe, safe_after: safeAfter, can_afford: safeAfter >= 0,\n    forecast_before: fc.projected, forecast_after: fc.projected === null ? null : fc.projected + purchase - Math.round(cutMonthly * frac), goals,\n    assumptions: ['uses_tracked_balances', 'cut_based_on_3_period_average', 'extra_saving_prorated_for_remaining_days'] };\n}\n\n// ---------- analytics ----------\nexport function periodsBack(profile, n) {\n  const out = []; let p = monthPeriod(profile.today, profile.month_start_day);\n  for (let i = 0; i \u003c n; i++) { out.unshift(p); p = previousPeriod('monthly', p, profile.month_start_day); }\n  return out;\n}\n\nexport function analytics(db, userId, profile, { from, to, currency, months = 6 }) {\n  const cur = summary(db, userId, { from, to, currency });\n  const series = periodsBack(profile, months).map((p) => { const s = summary(db, userId, { from: p.start, to: p.end, currency }); return { start: p.start, end: p.end, income: s.income, net_spend: s.net_spend, savings: s.savings, net_cashflow: s.net_cashflow, by_category: s.by_top_category.map((c) => ({ category_id: c.category_id, amount: c.amount })) }; });\n  const days = diffDays(from, to) + 1; const elapsed = Math.max(1, Math.min(days, diffDays(from, profile.today) + 1));\n  const topDays = [...cur.daily].filter((d) => d.amount > 0).sort((a, b) => b.amount - a.amount).slice(0, 5);\n  const rows = lines(db, userId, { from, to }).filter((r) => r.currency === currency);\n  const recurringSpend = rows.filter((r) => r.type === 'expense' && r.recurring_rule_id).reduce((s, r) => s + r.amount, 0);\n  // detected repeating merchants: same merchant in >=3 distinct months (heuristic, labelled as such in UI)\n  const since = addMonths(monthPeriod(profile.today, 1).start, -5, 1);\n  const hist = all(db, `SELECT m.name, strftime('%Y-%m', t.date) ym, SUM(t.amount) amt FROM transactions t JOIN merchants m ON m.id=t.merchant_id WHERE t.user_id=? AND t.deleted_at IS NULL AND t.type='expense' AND t.currency=? AND t.date>=? GROUP BY m.id, ym`, userId, currency, since);\n  const byM = new Map(); for (const h of hist) { (byM.get(h.name) ?? byM.set(h.name, []).get(h.name)).push(h.amt); }\n  const detected = [...byM].filter(([, v]) => v.length >= 3).map(([name, v]) => ({ name, months: v.length, avg: Math.round(v.reduce((a, b) => a + b, 0) / v.length) }));\n  const disc = one(db, `SELECT COALESCE(SUM(t.discount),0) d FROM transactions t WHERE t.user_id=? AND t.deleted_at IS NULL AND t.currency=? AND t.date BETWEEN ? AND ?`, userId, currency, from, to).d;\n  const prevP = previousPeriod('monthly', { start: from, end: to }, profile.month_start_day);\n  const prev = summary(db, userId, { from: prevP.start, to: prevP.end, currency });\n  const catDelta = []; const pm = new Map(prev.by_top_category.map((c) => [c.category_id, c.amount]));\n  for (const c of cur.by_top_category) catDelta.push({ category_id: c.category_id, current: c.amount, previous: pm.get(c.category_id) ?? 0, delta: c.amount - (pm.get(c.category_id) ?? 0) });\n  for (const [id, a] of pm) if (!cur.by_top_category.some((c) => c.category_id === id)) catDelta.push({ category_id: id, current: 0, previous: a, delta: -a });\n  return { currency, summary: cur, series, avg_daily_spend: Math.round(cur.net_spend / elapsed), elapsed_days: elapsed, top_days: topDays, recurring_spend: recurringSpend, detected_recurring: detected,\n    refunds: cur.refunds, invoice_discounts: disc, previous: { from: prevP.start, to: prevP.end, net_spend: prev.net_spend, income: prev.income }, category_change: catDelta.sort((a, b) => b.delta - a.delta),\n    budgets: budgetStatus(db, userId, profile).filter((b) => b.currency === currency) };\n}\n","server/lib/money.js":"// Money is stored as integer minor units (halalas, cents...) - exact, no floats.\nconst EXP = { SAR: 2, USD: 2, EUR: 2, AED: 2, EGP: 2, GBP: 2, QAR: 2, KWD: 3, BHD: 3, OMR: 3, JOD: 3, JPY: 0 };\nexport const SUPPORTED_CURRENCIES = Object.keys(EXP);\nexport const exponent = (cur) => EXP[cur] ?? 2;\n\nexport function toMinor(value, cur) {\n  const s = String(value).trim().replace(/,/g, '');\n  if (!/^-?\\d+(\\.\\d+)?$/.test(s)) throw new Error('invalid_amount');\n  const [i, f = ''] = s.split('.');\n  const e = exponent(cur);\n  if (f.length > e && /[1-9]/.test(f.slice(e))) throw new Error('too_many_decimals');\n  const n = Number(i + (f + '0'.repeat(e)).slice(0, e));\n  if (!Number.isSafeInteger(n)) throw new Error('invalid_amount');\n  return n === 0 ? 0 : n;\n}\n\nexport function fromMinor(n, cur) {\n  const e = exponent(cur);\n  const a = String(Math.abs(n)).padStart(e + 1, '0');\n  const body = e ? `${a.slice(0, -e)}.${a.slice(-e)}` : a;\n  return (n \u003c 0 ? '-' : '') + body;\n}\n\n// Split `total` across `weights` exactly (largest remainder). Sum of result === total.\nexport function allocate(total, weights) {\n  const sum = weights.reduce((a, b) => a + b, 0);\n  if (sum \u003c= 0) throw new Error('invalid_weights');\n  const raw = weights.map((w) => (total * w) / sum);\n  const out = raw.map(Math.floor);\n  let rest = total - out.reduce((a, b) => a + b, 0);\n  const order = raw.map((r, i) => [r - Math.floor(r), i]).sort((a, b) => b[0] - a[0]);\n  for (let k = 0; rest > 0; k++, rest--) out[order[k % order.length][1]]++;\n  return out;\n}\n","server/lib/parser.js":"// Natural-language transaction extractor (Arabic / English, rule based, deterministic).\n// Output is a list of draft items; nothing is invented: unknown fields stay null and are listed in `needs`.\nimport { heavy, light, classifyText, findMerchant } from './classifier.js';\nimport { addDays, weekday, diffDays, isIsoDate } from './dates.js';\n\nconst AR = '٠١٢٣٤٥٦٧٨٩', FA = '۰۱۲۳۴۵۶۷۸۹';\nexport function normalizeDigits(s) {\n  return String(s).replace(/[٠-٩]/g, (d) => AR.indexOf(d)).replace(/[۰-۹]/g, (d) => FA.indexOf(d))\n    .replace(/٫/g, '.').replace(/٬/g, ',');\n}\n\n// currency words (heavy-normalized). null value = ambiguous word -> ask the user.\nconst CURRENCY_WORDS = [\n  ['ريال سعودي', 'SAR'], ['ريالات', 'SAR'], ['ريال', 'SAR'], ['ر.س', 'SAR'], ['sar', 'SAR'], ['sr', 'SAR'], ['riyals', 'SAR'], ['riyal', 'SAR'],\n  ['دولار', 'USD'], ['usd', 'USD'], ['dollars', 'USD'], ['dollar', 'USD'], ['يورو', 'EUR'], ['eur', 'EUR'], ['euros', 'EUR'], ['euro', 'EUR'],\n  ['درهم', 'AED'], ['aed', 'AED'], ['dirhams', 'AED'], ['dirham', 'AED'], ['جنيه استرليني', 'GBP'], ['gbp', 'GBP'],\n  ['دينار كويتي', 'KWD'], ['kwd', 'KWD'], ['جنيه مصري', 'EGP'], ['egp', 'EGP'],\n  ['جنيه', null], ['دينار', null],\n].map(([w, c]) => [heavy(w), c]).sort((a, b) => b[0].length - a[0].length);\nconst SYMBOLS = { $: 'USD', '€': 'EUR', '£': 'GBP' };\nconst esc = (s) => s.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\nconst CUR_ALT = CURRENCY_WORDS.map(([w]) => esc(w)).join('|');\nconst AMOUNT_RE = new RegExp(\n  `([$€£])?\\\\s*(\\\\d{1,3}(?:,\\\\d{3})+(?:\\\\.\\\\d+)?|\\\\d+(?:\\\\.\\\\d+)?)(?:\\\\s*(k|الف|الاف|آلاف))?(?:\\\\s*(${CUR_ALT})(?![\\\\p{L}]))?`, 'giu');\n\nconst METHODS = [\n  ['credit_card', ['بطاقه ائتمانيه', 'البطاقه الائتمانيه', 'بطاقه الائتمان', 'كريدت', 'كريديت', 'credit card']],\n  ['apple_pay', ['ابل باي', 'apple pay']], ['stc_pay', ['stc pay', 'اس تي سي باي']],\n  ['mada', ['مدى', 'mada', 'بطاقه مدين', 'debit card', 'debit']],\n  ['cash', ['كاش', 'نقدا', 'نقد', 'cash']],\n];\n\nconst FILLERS = new Set(['اشتريت', 'اشترينا', 'دفعت', 'دفع', 'صرفت', 'سددت', 'حولت', 'استلمت', 'قبضت', 'جاني', 'تم', 'ب', 'من', 'في', 'على', 'عن', 'ل', 'فقط', 'مبلغ', 'بمبلغ', 'بقيمه', 'مقابل', 'عند',\n  'for', 'on', 'at', 'from', 'paid', 'pay', 'bought', 'buy', 'spent', 'spend', 'got', 'received', 'receive', 'i', 'a', 'an', 'the', 'to', 'with', 'my', 'of', 'by', 'using', 'via', 'and', 'و', 'اني', 'انا', 'ريال']);\nconst WAW_STOP = new Set(['وقود', 'وجبه', 'ورشه', 'وجبات']);\nconst INCOME_WORDS = ['راتب', 'استلمت', 'قبضت', 'مكافاه', 'salary', 'received', 'bonus', 'got paid', 'payroll', 'دخل'];\nconst REFUND_WORDS = ['استرداد', 'استرجاع', 'ارجاع', 'refund', 'cashback', 'رجع لي', 'رجعوا'];\nconst TRANSFER_WORDS = ['حولت', 'تحويل', 'transfer', 'transferred'];\nconst DEBT_WORDS = ['سداد', 'سددت', 'قسط', 'اقساط', 'installment', 'loan payment', 'repay'];\nconst EXPENSE_VERBS = ['اشتريت', 'دفعت', 'صرفت', 'bought', 'paid', 'spent'];\n\nconst WEEKDAYS = [['الاحد', 'sunday'], ['الاثنين', 'monday'], ['الثلاثاء', 'tuesday'], ['الاربعاء', 'wednesday'], ['الخميس', 'thursday'], ['الجمعه', 'friday'], ['السبت', 'saturday']];\n\nfunction extractDate(text, today) {\n  let t = text, date = today, assumptions = [], ambiguous = false, found = false;\n  const cut = (re) => { const m = re.exec(heavy(t)); if (!m) return null; t = t.slice(0, m.index) + ' ' + t.slice(m.index + m[0].length); return m; };\n  let m;\n  if ((m = cut(/(\\d{4})-(\\d{1,2})-(\\d{1,2})/))) {\n    const iso = `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;\n    if (isIsoDate(iso)) { date = iso; found = true; } else ambiguous = true;\n  } else if ((m = cut(/(?\u003c!\\d)(\\d{1,2})\\/(\\d{1,2})(?:\\/(\\d{4}|\\d{2}))?(?!\\d)/))) {\n    const [d, mo] = [Number(m[1]), Number(m[2])];\n    let y = m[3] ? (m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3])) : Number(today.slice(0, 4));\n    const iso = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;\n    if (isIsoDate(iso)) { date = iso; found = true; if (d \u003c= 12 && mo \u003c= 12 && d !== mo) { ambiguous = true; assumptions.push('date_dmy'); } } else ambiguous = true;\n  } else if (cut(/(اول امس|قبل امس|day before yesterday)/)) { date = addDays(today, -2); found = true; }\n  else if (cut(/(امس|yesterday)/)) { date = addDays(today, -1); found = true; }\n  else if ((m = cut(/(?:قبل|منذ)\\s*(\\d+)\\s*(?:ايام|يوم|يومين)|(\\d+)\\s*days? ago/))) { date = addDays(today, -Number(m[1] || m[2])); found = true; }\n  else if (cut(/(قبل يومين)/)) { date = addDays(today, -2); found = true; }\n  else if (cut(/(اليوم|today)/)) { found = true; }\n  else {\n    const h = heavy(t);\n    for (let i = 0; i \u003c 7; i++) {\n      const [ar, en] = WEEKDAYS[i];\n      const mm = new RegExp(`(^|\\\\s)(ال)?(${heavy(ar).replace(/^ال/, '')}|${en})(?![\\\\p{L}])`, 'u').exec(h);\n      if (mm) { const back = (weekday(today) - i + 7) % 7; date = addDays(today, -back); found = true; t = t.slice(0, mm.index) + ' ' + t.slice(mm.index + mm[0].length); break; }\n    }\n  }\n  if (date > today) { ambiguous = true; assumptions.push('date_future'); }\n  return { text: t, date, dateGiven: found, ambiguous, assumptions };\n}\n\nfunction extractAmounts(text) {\n  const out = []; AMOUNT_RE.lastIndex = 0; let m;\n  const h = heavy(text);\n  const re = new RegExp(AMOUNT_RE.source, 'giu');\n  while ((m = re.exec(h))) {\n    const num = m[2].replace(/,/g, '');\n    let value = parseFloat(num); if (!Number.isFinite(value) || value \u003c= 0) continue;\n    if (m[3]) value *= /^k$/i.test(m[3]) || /الف|الاف/.test(m[3]) ? 1000 : 1;\n    let currency, ambiguousCur = false, curWord = null;\n    if (m[1]) currency = SYMBOLS[m[1]];\n    if (m[4]) { const e = CURRENCY_WORDS.find(([w]) => w === m[4]); currency = e ? e[1] : undefined; if (e && e[1] === null) { ambiguousCur = true; currency = undefined; } curWord = m[4]; }\n    out.push({ start: m.index, end: m.index + m[0].length, value: Math.round(value * 1000) / 1000, currency, ambiguousCur });\n  }\n  return out;\n}\n\nfunction findMethod(h) {\n  for (const [key, phrases] of METHODS) {\n    for (const p of phrases) {\n      const i = h.indexOf(heavy(p));\n      if (i >= 0 && (!/^[a-z ]+$/.test(p) || /(^|[^a-z])$/.test(h.slice(0, i)))) return { key, start: i, end: i + p.length };\n    }\n  }\n  return null;\n}\n\nfunction cleanChunk(chunk, { stripLam = false } = {}) {\n  let tokens = light(chunk).split(/\\s+/).filter(Boolean);\n  if (stripLam && tokens.length) {\n    let f = tokens[0];\n    if (/^لل/.test(heavy(f)) && f.length > 3) tokens[0] = 'ال' + f.slice(2);\n    else if (/^ل[^\\sا]/.test(heavy(f)) && f.length > 3) tokens[0] = f.slice(1);\n  }\n  tokens = tokens.filter((t) => !FILLERS.has(heavy(t).replace(/[.,،;:!؟?]+$/g, '')));\n  return tokens.join(' ').replace(/[.,،;:!؟?+&]+$/g, '').trim();\n}\n\nconst CONJ_RE = /(^|\\s)(?:و|and)(?=\\s|$)|(^|\\s)و(?=[\\p{L}])|[,،;؛+&\\n]/u;\nfunction splitChunk(chunk) {\n  const h = heavy(chunk);\n  const m = CONJ_RE.exec(h);\n  if (!m) return [null, chunk];\n  if (/و(?=[\\p{L}])/u.test(m[0]) && !/[,،;؛+&\\n]/.test(m[0])) {\n    const word = h.slice(m.index + m[0].length - 1).split(/\\s+/)[0];\n    if (WAW_STOP.has(word)) return [null, chunk];\n  }\n  return [chunk.slice(0, m.index), chunk.slice(m.index + m[0].length)];\n}\n\nexport function parseText(input, { today, defaultCurrency = 'SAR' } = {}) {\n  const raw = normalizeDigits(String(input || '')).slice(0, 2000);\n  const result = { items: [], warnings: [] };\n  const d = extractDate(light(raw), today);\n  const text = d.text;\n  const amounts = extractAmounts(text);\n  if (!amounts.length) { result.warnings.push('no_amount'); return result; }\n\n  const chunks = []; // chunks[0] before first amount ... chunks[n] after last amount\n  let pos = 0;\n  for (const a of amounts) { chunks.push(text.slice(pos, a.start)); pos = a.end; }\n  chunks.push(text.slice(pos));\n  const pre = [chunks[0]], post = [];\n  for (let i = 1; i \u003c amounts.length; i++) {\n    const [p, n] = splitChunk(chunks[i]);\n    if (p === null) { post.push(''); pre.push(n); } else { post.push(p); pre.push(n); }\n  }\n  post.push(chunks[amounts.length]);\n\n  const hAll = heavy(text);\n  const globalIncome = INCOME_WORDS.some((w) => hAll.includes(heavy(w))) && !EXPENSE_VERBS.some((w) => hAll.includes(heavy(w)));\n\n  amounts.forEach((a, i) => {\n    let segPre = pre[i], segPost = post[i];\n    const hs = heavy(`${segPre} ${segPost}`);\n    // payment method (explicit mentions only)\n    let method = null;\n    for (const part of ['pre', 'post']) {\n      const s = part === 'pre' ? segPre : segPost; const mm = findMethod(heavy(s));\n      if (mm) { method = method || mm.key; const cutS = s.slice(0, mm.start) + ' ' + s.slice(mm.end); if (part === 'pre') segPre = cutS; else segPost = cutS; }\n    }\n    const tags = [...`${segPre} ${segPost}`.matchAll(/#([\\p{L}\\d_]+)/gu)].map((x) => x[1]);\n    segPre = segPre.replace(/#[\\p{L}\\d_]+/gu, ' '); segPost = segPost.replace(/#[\\p{L}\\d_]+/gu, ' ');\n\n    // merchant: \"من X\" / \"at X\" marker or known merchant dictionary\n    let merchant = null;\n    const mk = /(?:^|\\s)(?:من|عند|at|from)\\s+([^\\s].*)$/u.exec(light(`${segPre} ${segPost}`));\n    const known = findMerchant(`${segPre} ${segPost}`);\n    if (known) merchant = known.name;\n    else if (mk) { const cand = cleanChunk(mk[1]); if (cand && cand.split(' ').length \u003c= 3) merchant = cand; }\n\n    let description = cleanChunk(segPre);\n    if (!description) description = cleanChunk(segPost, { stripLam: true });\n    if (!description && merchant) description = merchant;\n    if (description && merchant && heavy(description).includes(heavy(merchant)) && description.split(' ').length > 1 && known) description = description;\n\n    // type\n    let type = 'expense';\n    const has = (ws) => ws.some((w) => hs.includes(heavy(w)));\n    if (has(REFUND_WORDS)) type = 'refund';\n    else if (has(TRANSFER_WORDS)) type = 'transfer';\n    else if (has(INCOME_WORDS) || (globalIncome && !has(EXPENSE_VERBS))) type = 'income';\n    else if (has(DEBT_WORDS) && /قسط|اقساط|installment/.test(hs) === false) type = 'debt_payment';\n\n    const cls = classifyText(`${description} ${segPre} ${segPost}`, merchant);\n    const needs = [];\n    const assumptions = [...d.assumptions];\n    let currency = a.currency;\n    if (!currency) {\n      if (a.ambiguousCur) needs.push('currency');\n      currency = defaultCurrency; assumptions.push('currency_default');\n    }\n    if (!description) needs.push('description');\n    if (d.ambiguous) needs.push('date');\n    if (type === 'transfer') needs.push('account', 'to_account');\n    if (type !== 'transfer' && (!cls.key || cls.confidence \u003c 0.6)) needs.push('category');\n    result.items.push({\n      type, amount: String(a.value), currency, currency_assumed: !a.currency,\n      date: d.date, date_given: d.dateGiven, description, merchant, payment_method: method, tags,\n      category_key: type === 'transfer' ? null : cls.key, confidence: cls.key ? cls.confidence : 0,\n      reason_key: cls.reason_key, reason: cls.reason, needs: [...new Set(needs)], assumptions: [...new Set(assumptions)],\n    });\n  });\n  return result;\n}\n","server/lib/tx.js":"// Transactions: validation, persistence (splits / invoice items), duplicates, learning, listing.\nimport { tx as dbtx, audit } from '../db.js';\nimport { all, one, run, bad, notFound, owned, HttpError, categoryScope, categoryIdByKey } from './base.js';\nimport { toMinor, fromMinor, allocate, SUPPORTED_CURRENCIES } from './money.js';\nimport { isIsoDate, addDays } from './dates.js';\nimport { heavy, light, classifyText, findMerchant, normMerchant } from './classifier.js';\n\nexport const TYPES = ['expense', 'income', 'transfer', 'refund', 'debt_payment'];\nconst METHODS = ['cash', 'mada', 'credit_card', 'apple_pay', 'stc_pay', 'bank_transfer', 'other'];\n\n// ---------- learning & classification with user overrides ----------\nconst descPattern = (d) => heavy(light(d || '')).replace(/\\s+/g, ' ').trim().slice(0, 60);\n\nexport function classifyForUser(db, userId, { description = '', merchant = null }) {\n  const pat = descPattern(description);\n  if (pat) {\n    const r = one(db, 'SELECT * FROM learned_rules WHERE user_id=? AND pattern=?', userId, pat);\n    if (r) return { category_id: r.category_id, confidence: Math.min(0.95, 0.8 + 0.05 * r.hits), reason_key: 'learned', reason: 'learned from your edits' };\n  }\n  if (merchant) {\n    const m = one(db, 'SELECT default_category_id FROM merchants WHERE user_id=? AND normalized=?', userId, normMerchant(merchant));\n    if (m?.default_category_id) return { category_id: m.default_category_id, confidence: 0.9, reason_key: 'merchant_default', reason: 'your usual category for this merchant' };\n  }\n  const c = classifyText(description, merchant);\n  return { category_id: c.key ? categoryIdByKey(db, userId, c.key) : null, category_key: c.key, confidence: c.confidence, reason_key: c.reason_key, reason: c.reason };\n}\n\nexport function learn(db, userId, { description, merchant, category_id }) {\n  if (!category_id) return;\n  const pat = descPattern(description);\n  if (pat) run(db, 'INSERT INTO learned_rules (user_id,pattern,category_id) VALUES (?,?,?) ON CONFLICT(user_id,pattern) DO UPDATE SET category_id=excluded.category_id, hits=CASE WHEN category_id=excluded.category_id THEN hits+1 ELSE 1 END', userId, pat, category_id);\n  // a merchant that sells many categories never gets a default: the item decides, not the shop\n  if (merchant && !findMerchant(merchant)?.multi) run(db, 'UPDATE merchants SET default_category_id=? WHERE user_id=? AND normalized=?', category_id, userId, normMerchant(merchant));\n}\n\nfunction upsertMerchant(db, userId, name) {\n  const n = String(name || '').trim().slice(0, 80); if (!n) return null;\n  const norm = normMerchant(n);\n  const ex = one(db, 'SELECT id FROM merchants WHERE user_id=? AND normalized=?', userId, norm);\n  if (ex) return ex.id;\n  return Number(run(db, 'INSERT INTO merchants (user_id,name,normalized) VALUES (?,?,?)', userId, n, norm).lastInsertRowid);\n}\n\n// ---------- invoice reconciliation ----------\nexport function reconcileInvoice({ items = [], tax = 0, discount = 0, total }) {\n  const itemsSum = items.reduce((a, i) => a + i.amount, 0);\n  const expected = itemsSum + tax - discount;\n  return { items_sum: itemsSum, expected, total, diff: total - expected, matches: total === expected };\n}\n\n// ---------- validation / normalisation (no DB writes except merchant upsert) ----------\nexport function normalize(db, userId, input, profile, existing = null) {\n  const src = { ...(existing ?? {}), ...input };\n  const type = src.type ?? 'expense';\n  if (!TYPES.includes(type)) throw bad('invalid_type');\n  const account = owned(db, 'accounts', src.account_id, userId);\n  const toAccount = type === 'transfer' ? owned(db, 'accounts', src.to_account_id, userId) : null;\n  if (type === 'transfer' && (!account || !toAccount)) throw bad('transfer_needs_two_accounts');\n  if (type === 'transfer' && account.id === toAccount.id) throw bad('transfer_same_account');\n  const currency = String(account?.currency ?? src.currency ?? profile.currency).toUpperCase();\n  if (!SUPPORTED_CURRENCIES.includes(currency)) throw bad('unsupported_currency');\n  if (account && src.currency && String(src.currency).toUpperCase() !== account.currency) throw bad('currency_mismatch', { account_currency: account.currency });\n  let amount; try { amount = existing && input.amount === undefined ? existing.amount : toMinor(src.amount, currency); } catch (e) { throw bad(e.message); }\n  if (!(amount > 0)) throw bad('amount_must_be_positive');\n  const date = src.date ?? profile.today;\n  if (!isIsoDate(date)) throw bad('invalid_date');\n  let toAmount = null;\n  if (type === 'transfer') {\n    if (toAccount.currency !== account.currency) {\n      if (src.to_amount === undefined || src.to_amount === null || src.to_amount === '') throw bad('to_amount_required', { currency: toAccount.currency });\n      toAmount = existing && input.to_amount === undefined ? existing.to_amount : toMinor(src.to_amount, toAccount.currency);\n    }\n  }\n  const category = type === 'transfer' ? null : owned(db, 'categories', src.category_id, userId);\n  const method = src.payment_method || null;\n  if (method && !METHODS.includes(method)) throw bad('invalid_payment_method');\n  const merchant_id = input.merchant !== undefined ? upsertMerchant(db, userId, input.merchant) : (existing?.merchant_id ?? null);\n  const tags = Array.isArray(src.tags) ? src.tags : (typeof src.tags === 'string' ? JSON.parse(src.tags || '[]') : []);\n  const out = {\n    type, account_id: account?.id ?? null, to_account_id: toAccount?.id ?? null, to_amount: toAmount, amount, currency, date,\n    description: String(src.description ?? '').slice(0, 300), merchant_id, category_id: category?.id ?? null, payment_method: method,\n    tags: JSON.stringify(tags.map((t) => String(t).slice(0, 30)).slice(0, 10)),\n    status: src.status === 'review' ? 'review' : 'confirmed', confidence: src.confidence ?? null, reason: src.reason ?? null,\n    source: src.source ?? 'manual', import_job_id: src.import_job_id ?? null, external_ref: src.external_ref ? String(src.external_ref).slice(0, 100) : null,\n    recurring_rule_id: src.recurring_rule_id ?? null,\n    subtotal: null, tax: null, discount: null, splits: null, items: null,\n  };\n  const splitsIn = input.splits ?? null, itemsIn = input.items ?? null;\n  if (type === 'transfer' && (splitsIn?.length || itemsIn?.length)) throw bad('transfer_cannot_have_splits');\n  if (splitsIn?.length) {\n    out.splits = splitsIn.map((s) => { owned(db, 'categories', s.category_id, userId); let a; try { a = toMinor(s.amount, currency); } catch (e) { throw bad(e.message); } return { category_id: Number(s.category_id), amount: a }; });\n    const sum = out.splits.reduce((a, s) => a + s.amount, 0);\n    if (out.splits.some((s) => s.amount \u003c= 0)) throw bad('split_amount_invalid');\n    if (sum !== amount) throw bad('splits_must_equal_total', { splits_sum: fromMinor(sum, currency), total: fromMinor(amount, currency) });\n  }\n  if (itemsIn?.length) {\n    out.items = itemsIn.map((i) => {\n      const qty = Number(i.quantity ?? 1); if (!(qty > 0)) throw bad('item_quantity_invalid');\n      const unit = toMinor(i.unit_price ?? i.amount, currency);\n      const amt = i.amount !== undefined && i.amount !== '' ? toMinor(i.amount, currency) : Math.round(unit * qty);\n      return { name: String(i.name || '').slice(0, 200) || '—', quantity: qty, unit_price: unit, amount: amt, category_id: i.category_id ? owned(db, 'categories', i.category_id, userId).id : null };\n    });\n    out.tax = input.tax ? toMinor(input.tax, currency) : 0; out.discount = input.discount ? toMinor(input.discount, currency) : 0;\n    out.subtotal = out.items.reduce((a, i) => a + i.amount, 0);\n    const rec = reconcileInvoice({ items: out.items, tax: out.tax, discount: out.discount, total: amount });\n    out.reconciliation = rec;\n    if (!rec.matches && !input.acknowledge_mismatch) {\n      throw new HttpError(422, 'invoice_mismatch', { items_sum: fromMinor(rec.items_sum, currency), tax: fromMinor(out.tax, currency), discount: fromMinor(out.discount, currency), expected: fromMinor(rec.expected, currency), total: fromMinor(amount, currency), diff: fromMinor(rec.diff, currency) });\n    }\n    // Items match the printed total -> derive category splits exactly (tax/discount spread proportionally).\n    // Mismatch (acknowledged) -> numbers are NOT adjusted; single category, items kept as detail only.\n    if (rec.matches && !out.splits) {\n      const groups = new Map();\n      for (const i of out.items) { const k = i.category_id ?? out.category_id ?? 0; groups.set(k, (groups.get(k) ?? 0) + i.amount); }\n      if (groups.size > 1 || (groups.size === 1 && [...groups.keys()][0] !== (out.category_id ?? 0))) {\n        const keys = [...groups.keys()].filter((k) => k !== 0);\n        if (keys.length === groups.size) {\n          const parts = allocate(amount, keys.map((k) => groups.get(k)));\n          out.splits = keys.map((k, n) => ({ category_id: k, amount: parts[n] }));\n        }\n      }\n    }\n  } else if (existing && input.items === undefined) {\n    out.subtotal = existing.subtotal; out.tax = existing.tax; out.discount = existing.discount;\n  }\n  return out;\n}\n\nfunction writeChildren(db, id, n, replace) {\n  if (replace.splits) run(db, 'DELETE FROM transaction_splits WHERE transaction_id=?', id);\n  if (replace.items) run(db, 'DELETE FROM transaction_items WHERE transaction_id=?', id);\n  for (const s of n.splits ?? []) run(db, 'INSERT INTO transaction_splits (transaction_id,category_id,amount) VALUES (?,?,?)', id, s.category_id, s.amount);\n  for (const i of n.items ?? []) run(db, 'INSERT INTO transaction_items (transaction_id,name,quantity,unit_price,amount,category_id) VALUES (?,?,?,?,?,?)', id, i.name, i.quantity, i.unit_price, i.amount, i.category_id);\n}\n\n// ---------- duplicates ----------\nexport function findDuplicates(db, userId, c, { excludeId = null } = {}) {\n  const rows = all(db, `SELECT t.*, m.name AS merchant_name FROM transactions t LEFT JOIN merchants m ON m.id=t.merchant_id\n    WHERE t.user_id=? AND t.deleted_at IS NULL AND t.amount=? AND t.currency=? AND t.type=? AND t.date BETWEEN ? AND ? AND t.id\u003c>?`,\n    userId, c.amount, c.currency, c.type, addDays(c.date, -1), addDays(c.date, 1), excludeId ?? -1);\n  const cd = descPattern(c.description), cm = c.merchant_name ? normMerchant(c.merchant_name) : null;\n  const out = [];\n  for (const r of rows) {\n    const sameDesc = cd && descPattern(r.description) === cd; const sameMerch = cm && r.merchant_name && normMerchant(r.merchant_name) === cm;\n    let score = 0, why = [];\n    if (c.external_ref && r.external_ref === c.external_ref) { score = 1; why.push('same_reference'); }\n    else if (r.date === c.date && (sameDesc || sameMerch)) { score = 0.9; why.push('same_date_amount_text'); }\n    else if (r.date === c.date) { score = 0.6; why.push('same_date_amount'); }\n    else if (sameDesc || sameMerch) { score = 0.6; why.push('adjacent_date_same_text'); }\n    if (score >= 0.6) out.push({ id: r.id, date: r.date, amount: fromMinor(r.amount, r.currency), currency: r.currency, description: r.description, merchant: r.merchant_name, score, why, source: r.source, import_job_id: r.import_job_id });\n  }\n  return out.sort((a, b) => b.score - a.score);\n}\n\n// ---------- CRUD ----------\nexport function insertNormalized(db, userId, n, { learnFrom = true } = {}) {\n  const id = Number(run(db, `INSERT INTO transactions (user_id,type,account_id,to_account_id,to_amount,amount,currency,date,description,merchant_id,category_id,payment_method,tags,status,confidence,reason,source,import_job_id,external_ref,subtotal,tax,discount,recurring_rule_id)\n    VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`, userId, n.type, n.account_id, n.to_account_id, n.to_amount, n.amount, n.currency, n.date, n.description, n.merchant_id, n.category_id, n.payment_method, n.tags, n.status, n.confidence, n.reason, n.source, n.import_job_id, n.external_ref, n.subtotal, n.tax, n.discount, n.recurring_rule_id).lastInsertRowid);\n  writeChildren(db, id, n, { splits: false, items: false });\n  audit(db, userId, 'transaction', id, 'create', null, { type: n.type, amount: n.amount, currency: n.currency, date: n.date });\n  if (learnFrom && n.category_id && n.status === 'confirmed' && n.type !== 'transfer' && ['manual', 'nl', 'receipt'].includes(n.source)) {\n    const mname = n.merchant_id ? one(db, 'SELECT name FROM merchants WHERE id=?', n.merchant_id)?.name : null;\n    learn(db, userId, { description: n.description, merchant: mname, category_id: n.category_id });\n  }\n  return id;\n}\n\nexport function createTransaction(db, userId, input, profile, { force = false } = {}) {\n  const n = normalize(db, userId, input, profile);\n  if (!force) {\n    const mname = n.merchant_id ? one(db, 'SELECT name FROM merchants WHERE id=?', n.merchant_id)?.name : null;\n    const dups = findDuplicates(db, userId, { ...n, merchant_name: mname });\n    if (dups.length) throw new HttpError(409, 'possible_duplicate', { duplicates: dups });\n  }\n  const id = dbtx(db, () => insertNormalized(db, userId, n));\n  return getTransaction(db, userId, id);\n}\n\nexport function updateTransaction(db, userId, id, input, profile) {\n  const ex = one(db, 'SELECT * FROM transactions WHERE id=? AND user_id=? AND deleted_at IS NULL', id, userId);\n  if (!ex) throw notFound('transaction_not_found');\n  const before = getTransaction(db, userId, id);\n  const n = normalize(db, userId, input, profile, ex);\n  const replace = { splits: input.splits !== undefined || input.amount !== undefined || input.category_id !== undefined, items: input.items !== undefined };\n  // an amount/category change invalidates old derived splits unless new ones are supplied\n  dbtx(db, () => {\n    run(db, `UPDATE transactions SET type=?,account_id=?,to_account_id=?,to_amount=?,amount=?,currency=?,date=?,description=?,merchant_id=?,category_id=?,payment_method=?,tags=?,status=?,confidence=?,reason=?,external_ref=?,subtotal=?,tax=?,discount=?,updated_at=datetime('now') WHERE id=? AND user_id=?`,\n      n.type, n.account_id, n.to_account_id, n.to_amount, n.amount, n.currency, n.date, n.description, n.merchant_id, n.category_id, n.payment_method, n.tags, n.status, n.confidence, n.reason, n.external_ref, n.subtotal, n.tax, n.discount, id, userId);\n    writeChildren(db, id, n, replace);\n    if (input.category_id !== undefined && n.category_id && n.category_id !== ex.category_id && n.type !== 'transfer') {\n      const mname = n.merchant_id ? one(db, 'SELECT name FROM merchants WHERE id=?', n.merchant_id)?.name : null;\n      learn(db, userId, { description: n.description, merchant: mname, category_id: n.category_id });\n    }\n    audit(db, userId, 'transaction', id, 'update', { amount: before.amount, category_id: before.category_id, date: before.date, type: before.type, account_id: before.account_id }, { amount: fromMinor(n.amount, n.currency), category_id: n.category_id, date: n.date, type: n.type, account_id: n.account_id });\n  });\n  return getTransaction(db, userId, id);\n}\n\nexport function deleteTransactions(db, userId, ids) {\n  let n = 0;\n  dbtx(db, () => {\n    for (const id of ids) {\n      const r = run(db, \"UPDATE transactions SET deleted_at=datetime('now') WHERE id=? AND user_id=? AND deleted_at IS NULL\", Number(id), userId);\n      if (r.changes) { n++; audit(db, userId, 'transaction', Number(id), 'delete', null, null); }\n    }\n  });\n  return n;\n}\n\nexport function bulkUpdate(db, userId, ids, patch) {\n  let n = 0;\n  dbtx(db, () => {\n    for (const id of ids) {\n      const t = one(db, 'SELECT * FROM transactions WHERE id=? AND user_id=? AND deleted_at IS NULL', Number(id), userId);\n      if (!t) continue;\n      if (patch.category_id !== undefined) {\n        if (t.type === 'transfer') continue;\n        const cat = owned(db, 'categories', patch.category_id, userId);\n        run(db, \"UPDATE transactions SET category_id=?, status='confirmed', updated_at=datetime('now') WHERE id=?\", cat.id, t.id);\n        run(db, 'DELETE FROM transaction_splits WHERE transaction_id=?', t.id);\n        const mname = t.merchant_id ? one(db, 'SELECT name FROM merchants WHERE id=?', t.merchant_id)?.name : null;\n        learn(db, userId, { description: t.description, merchant: mname, category_id: cat.id });\n      }\n      if (patch.status === 'confirmed') run(db, \"UPDATE transactions SET status='confirmed', updated_at=datetime('now') WHERE id=?\", t.id);\n      audit(db, userId, 'transaction', t.id, 'bulk_update', null, patch); n++;\n    }\n  });\n  return n;\n}\n\nexport function shape(db, r) {\n  const cur = r.currency;\n  const o = { ...r, amount_minor: r.amount, amount: fromMinor(r.amount, cur), tags: JSON.parse(r.tags || '[]') };\n  for (const k of ['subtotal', 'tax', 'discount']) if (r[k] !== null && r[k] !== undefined) o[k] = fromMinor(r[k], cur);\n  if (r.to_amount !== null && r.to_amount !== undefined) {\n    const tc = one(db, 'SELECT currency FROM accounts WHERE id=?', r.to_account_id)?.currency ?? cur; o.to_amount = fromMinor(r.to_amount, tc);\n  }\n  return o;\n}\n\nexport function getTransaction(db, userId, id) {\n  const r = one(db, `SELECT t.*, m.name AS merchant_name FROM transactions t LEFT JOIN merchants m ON m.id=t.merchant_id WHERE t.id=? AND t.user_id=? AND t.deleted_at IS NULL`, Number(id), userId);\n  if (!r) throw notFound('transaction_not_found');\n  const o = shape(db, r);\n  o.splits = all(db, 'SELECT category_id, amount FROM transaction_splits WHERE transaction_id=? ORDER BY id', r.id).map((s) => ({ category_id: s.category_id, amount: fromMinor(s.amount, r.currency) }));\n  o.items = all(db, 'SELECT name, quantity, unit_price, amount, category_id FROM transaction_items WHERE transaction_id=? ORDER BY id', r.id).map((i) => ({ ...i, unit_price: fromMinor(i.unit_price, r.currency), amount: fromMinor(i.amount, r.currency) }));\n  o.attachments = all(db, 'SELECT id, filename, mime, size FROM attachments WHERE transaction_id=? AND user_id=?', r.id, userId);\n  if (o.items.length) o.reconciliation = reconcileInvoice({ items: all(db, 'SELECT amount FROM transaction_items WHERE transaction_id=?', r.id), tax: r.tax ?? 0, discount: r.discount ?? 0, total: r.amount });\n  return o;\n}\n\nexport function listTransactions(db, userId, f = {}) {\n  const w = ['t.user_id=?', 't.deleted_at IS NULL']; const p = [userId];\n  if (f.from) { w.push('t.date>=?'); p.push(f.from); }\n  if (f.to) { w.push('t.date\u003c=?'); p.push(f.to); }\n  if (f.type) { w.push('t.type=?'); p.push(f.type); }\n  if (f.status) { w.push('t.status=?'); p.push(f.status); }\n  if (f.currency) { w.push('t.currency=?'); p.push(f.currency); }\n  if (f.account_id) { w.push('(t.account_id=? OR t.to_account_id=?)'); p.push(Number(f.account_id), Number(f.account_id)); }\n  if (f.category_id) {\n    const ids = categoryScope(db, userId, f.category_id).join(',');\n    w.push(`(t.category_id IN (${ids}) OR EXISTS (SELECT 1 FROM transaction_splits s WHERE s.transaction_id=t.id AND s.category_id IN (${ids})))`);\n  }\n  if (f.q) { w.push('(t.description LIKE ? ESCAPE \\'\\\\\\' OR m.name LIKE ? ESCAPE \\'\\\\\\')'); const like = `%${String(f.q).replace(/[\\\\%_]/g, '\\\\$&')}%`; p.push(like, like); }\n  const sortCol = f.sort === 'amount' ? 't.amount' : 't.date'; const dir = f.dir === 'asc' ? 'ASC' : 'DESC';\n  const where = w.join(' AND ');\n  const total = one(db, `SELECT COUNT(*) c FROM transactions t LEFT JOIN merchants m ON m.id=t.merchant_id WHERE ${where}`, ...p).c;\n  const limit = Math.min(Number(f.limit) || 50, 500), offset = Math.max(Number(f.offset) || 0, 0);\n  const rows = all(db, `SELECT t.*, m.name AS merchant_name FROM transactions t LEFT JOIN merchants m ON m.id=t.merchant_id WHERE ${where} ORDER BY ${sortCol} ${dir}, t.id DESC LIMIT ? OFFSET ?`, ...p, limit, offset);\n  return { total, items: rows.map((r) => shape(db, r)) };\n}\n","server/db.js":"const SCHEMA = `\nPRAGMA foreign_keys = ON;\nPRAGMA journal_mode = WAL;\n\nCREATE TABLE IF NOT EXISTS users (\n  id INTEGER PRIMARY KEY, email TEXT NOT NULL UNIQUE COLLATE NOCASE,\n  password_hash TEXT NOT NULL, created_at TEXT NOT NULL DEFAULT (datetime('now')));\nCREATE TABLE IF NOT EXISTS sessions (\n  token_hash TEXT PRIMARY KEY, user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  expires_at TEXT NOT NULL, created_at TEXT NOT NULL DEFAULT (datetime('now')));\nCREATE TABLE IF NOT EXISTS profiles (\n  user_id INTEGER PRIMARY KEY REFERENCES users(id) ON DELETE CASCADE,\n  name TEXT, language TEXT NOT NULL DEFAULT 'ar' CHECK (language IN ('ar','en')),\n  currency TEXT NOT NULL DEFAULT 'SAR', timezone TEXT NOT NULL DEFAULT 'Asia/Riyadh',\n  month_start_day INTEGER NOT NULL DEFAULT 1 CHECK (month_start_day BETWEEN 1 AND 28),\n  theme TEXT NOT NULL DEFAULT 'system' CHECK (theme IN ('system','light','dark')),\n  default_account_id INTEGER,\n  notif_prefs TEXT NOT NULL DEFAULT '{\"budget\":true,\"due\":true,\"low_balance\":true,\"anomaly\":true,\"goal\":true}',\n  safe_prefs TEXT NOT NULL DEFAULT '{\"reserve_goals\":true,\"reserve_budgets\":false}',\n  allow_ai_external INTEGER NOT NULL DEFAULT 0,\n  is_demo INTEGER NOT NULL DEFAULT 0,\n  updated_at TEXT NOT NULL DEFAULT (datetime('now')));\nCREATE TABLE IF NOT EXISTS accounts (\n  id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  name TEXT NOT NULL, type TEXT NOT NULL CHECK (type IN ('cash','bank','wallet','credit_card','savings')),\n  currency TEXT NOT NULL, opening_balance INTEGER NOT NULL DEFAULT 0, credit_limit INTEGER,\n  verified_balance INTEGER, verified_at TEXT, archived INTEGER NOT NULL DEFAULT 0,\n  created_at TEXT NOT NULL DEFAULT (datetime('now')), updated_at TEXT NOT NULL DEFAULT (datetime('now')));\nCREATE INDEX IF NOT EXISTS idx_accounts_user ON accounts(user_id);\nCREATE TABLE IF NOT EXISTS categories (\n  id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  parent_id INTEGER REFERENCES categories(id) ON DELETE RESTRICT, key TEXT,\n  name_ar TEXT NOT NULL, name_en TEXT NOT NULL,\n  kind TEXT NOT NULL DEFAULT 'expense' CHECK (kind IN ('expense','income','saving','other')),\n  color TEXT NOT NULL DEFAULT '#64748b', icon TEXT NOT NULL DEFAULT '•', archived INTEGER NOT NULL DEFAULT 0,\n  created_at TEXT NOT NULL DEFAULT (datetime('now')));\nCREATE INDEX IF NOT EXISTS idx_categories_user ON categories(user_id, parent_id);\nCREATE TABLE IF NOT EXISTS merchants (\n  id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  name TEXT NOT NULL, normalized TEXT NOT NULL, default_category_id INTEGER REFERENCES categories(id) ON DELETE SET NULL,\n  created_at TEXT NOT NULL DEFAULT (datetime('now')), UNIQUE (user_id, normalized));\nCREATE TABLE IF NOT EXISTS import_jobs (\n  id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  filename TEXT, total INTEGER NOT NULL DEFAULT 0, accepted INTEGER NOT NULL DEFAULT 0, rejected INTEGER NOT NULL DEFAULT 0,\n  report TEXT, created_at TEXT NOT NULL DEFAULT (datetime('now')));\nCREATE TABLE IF NOT EXISTS transactions (\n  id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  type TEXT NOT NULL CHECK (type IN ('expense','income','transfer','refund','debt_payment')),\n  account_id INTEGER REFERENCES accounts(id) ON DELETE RESTRICT,\n  to_account_id INTEGER REFERENCES accounts(id) ON DELETE RESTRICT, to_amount INTEGER,\n  amount INTEGER NOT NULL CHECK (amount > 0), currency TEXT NOT NULL,\n  date TEXT NOT NULL, description TEXT NOT NULL DEFAULT '',\n  merchant_id INTEGER REFERENCES merchants(id) ON DELETE SET NULL,\n  category_id INTEGER REFERENCES categories(id) ON DELETE SET NULL,\n  payment_method TEXT, tags TEXT NOT NULL DEFAULT '[]',\n  status TEXT NOT NULL DEFAULT 'confirmed' CHECK (status IN ('confirmed','review')),\n  confidence REAL, reason TEXT, source TEXT NOT NULL DEFAULT 'manual',\n  import_job_id INTEGER REFERENCES import_jobs(id) ON DELETE SET NULL, external_ref TEXT,\n  subtotal INTEGER, tax INTEGER, discount INTEGER, recurring_rule_id INTEGER,\n  created_at TEXT NOT NULL DEFAULT (datetime('now')), updated_at TEXT NOT NULL DEFAULT (datetime('now')), deleted_at TEXT,\n  CHECK (type \u003c> 'transfer' OR (account_id IS NOT NULL AND to_account_id IS NOT NULL AND account_id \u003c> to_account_id)));\nCREATE INDEX IF NOT EXISTS idx_tx_user_date ON transactions(user_id, date) WHERE deleted_at IS NULL;\nCREATE INDEX IF NOT EXISTS idx_tx_dup ON transactions(user_id, amount, date);\nCREATE INDEX IF NOT EXISTS idx_tx_ref ON transactions(user_id, external_ref);\nCREATE TABLE IF NOT EXISTS transaction_splits (\n  id INTEGER PRIMARY KEY, transaction_id INTEGER NOT NULL REFERENCES transactions(id) ON DELETE CASCADE,\n  category_id INTEGER REFERENCES categories(id) ON DELETE SET NULL, amount INTEGER NOT NULL CHECK (amount > 0));\nCREATE INDEX IF NOT EXISTS idx_split_tx ON transaction_splits(transaction_id);\n-- Items are descriptive detail of ONE invoice transaction; they are never summed into reports.\nCREATE TABLE IF NOT EXISTS transaction_items (\n  id INTEGER PRIMARY KEY, transaction_id INTEGER NOT NULL REFERENCES transactions(id) ON DELETE CASCADE,\n  name TEXT NOT NULL, quantity REAL NOT NULL DEFAULT 1, unit_price INTEGER NOT NULL, amount INTEGER NOT NULL,\n  category_id INTEGER REFERENCES categories(id) ON DELETE SET NULL);\nCREATE TABLE IF NOT EXISTS budgets (\n  id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  category_id INTEGER REFERENCES categories(id) ON DELETE CASCADE,\n  period TEXT NOT NULL CHECK (period IN ('weekly','monthly','yearly')),\n  amount INTEGER NOT NULL CHECK (amount > 0), currency TEXT NOT NULL,\n  rollover INTEGER NOT NULL DEFAULT 0, thresholds TEXT NOT NULL DEFAULT '[80,100]',\n  created_at TEXT NOT NULL DEFAULT (datetime('now')), updated_at TEXT NOT NULL DEFAULT (datetime('now')));\nCREATE UNIQUE INDEX IF NOT EXISTS idx_budget_unique ON budgets(user_id, IFNULL(category_id,0), period, currency);\nCREATE TABLE IF NOT EXISTS recurring_rules (\n  id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  name TEXT NOT NULL, type TEXT NOT NULL CHECK (type IN ('expense','income','transfer','debt_payment')),\n  amount INTEGER NOT NULL CHECK (amount > 0), currency TEXT NOT NULL,\n  account_id INTEGER REFERENCES accounts(id) ON DELETE SET NULL, to_account_id INTEGER REFERENCES accounts(id) ON DELETE SET NULL,\n  category_id INTEGER REFERENCES categories(id) ON DELETE SET NULL,\n  frequency TEXT NOT NULL CHECK (frequency IN ('weekly','monthly','yearly')), interval_n INTEGER NOT NULL DEFAULT 1,\n  anchor_day INTEGER, next_due TEXT NOT NULL, remind_days INTEGER NOT NULL DEFAULT 3,\n  active INTEGER NOT NULL DEFAULT 1, last_paid_date TEXT, last_paid_amount INTEGER,\n  created_at TEXT NOT NULL DEFAULT (datetime('now')));\nCREATE TABLE IF NOT EXISTS savings_goals (\n  id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  name TEXT NOT NULL, target INTEGER NOT NULL CHECK (target > 0), currency TEXT NOT NULL,\n  target_date TEXT, archived INTEGER NOT NULL DEFAULT 0, created_at TEXT NOT NULL DEFAULT (datetime('now')));\nCREATE TABLE IF NOT EXISTS goal_contributions (\n  id INTEGER PRIMARY KEY, goal_id INTEGER NOT NULL REFERENCES savings_goals(id) ON DELETE CASCADE,\n  user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  amount INTEGER NOT NULL CHECK (amount \u003c> 0), date TEXT NOT NULL, note TEXT,\n  created_at TEXT NOT NULL DEFAULT (datetime('now')));\nCREATE TABLE IF NOT EXISTS attachments (\n  id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  transaction_id INTEGER NOT NULL REFERENCES transactions(id) ON DELETE CASCADE,\n  filename TEXT NOT NULL, mime TEXT NOT NULL, size INTEGER NOT NULL, path TEXT NOT NULL,\n  created_at TEXT NOT NULL DEFAULT (datetime('now')));\nCREATE TABLE IF NOT EXISTS ai_suggestions (\n  id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  input_text TEXT NOT NULL, output TEXT NOT NULL, engine TEXT NOT NULL,\n  status TEXT NOT NULL DEFAULT 'pending' CHECK (status IN ('pending','accepted','edited','rejected')),\n  created_at TEXT NOT NULL DEFAULT (datetime('now')));\nCREATE TABLE IF NOT EXISTS learned_rules (\n  id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  pattern TEXT NOT NULL, category_id INTEGER NOT NULL REFERENCES categories(id) ON DELETE CASCADE,\n  hits INTEGER NOT NULL DEFAULT 1, UNIQUE (user_id, pattern));\nCREATE TABLE IF NOT EXISTS fx_rates (\n  id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  from_currency TEXT NOT NULL, to_currency TEXT NOT NULL, date TEXT NOT NULL, rate TEXT NOT NULL, source TEXT,\n  UNIQUE (user_id, from_currency, to_currency, date));\nCREATE TABLE IF NOT EXISTS audit_logs (\n  id INTEGER PRIMARY KEY, user_id INTEGER, entity TEXT NOT NULL, entity_id INTEGER, action TEXT NOT NULL,\n  before TEXT, after TEXT, created_at TEXT NOT NULL DEFAULT (datetime('now')));\nCREATE INDEX IF NOT EXISTS idx_audit_user ON audit_logs(user_id, created_at);\n`;\n\n// Driver = any class exposing the DatabaseSync API (Node: node:sqlite via node-db.js; browser: standalone/minisql.js).\nexport function openDb(file, Driver) {\n  const db = new Driver(file);\n  db.exec(SCHEMA);\n  return db;\n}\n\n// Run fn inside a transaction (rollback on throw).\nexport function tx(db, fn) {\n  db.exec('BEGIN IMMEDIATE');\n  try { const r = fn(); db.exec('COMMIT'); return r; }\n  catch (e) { db.exec('ROLLBACK'); throw e; }\n}\n\nexport const audit = (db, userId, entity, entityId, action, before, after) =>\n  db.prepare('INSERT INTO audit_logs (user_id, entity, entity_id, action, before, after) VALUES (?,?,?,?,?,?)')\n    .run(userId, entity, entityId ?? null, action, before ? JSON.stringify(before) : null, after ? JSON.stringify(after) : null);\n\n// key, ar, en, kind, color, icon, children [[key, ar, en]]\nexport const DEFAULT_CATEGORIES = [\n  ['home', 'المنزل', 'Home', 'expense', '#0ea5e9', '🏠', [['rent', 'الإيجار', 'Rent'], ['electricity', 'الكهرباء', 'Electricity'], ['water', 'المياه', 'Water'], ['home_maintenance', 'الصيانة', 'Maintenance'], ['furniture', 'الأثاث', 'Furniture']]],\n  ['food', 'الطعام', 'Food', 'expense', '#f97316', '🍽️', [['groceries', 'البقالة', 'Groceries'], ['restaurants', 'المطاعم', 'Restaurants'], ['coffee', 'القهوة', 'Coffee'], ['delivery', 'التوصيل', 'Delivery']]],\n  ['transport', 'النقل', 'Transport', 'expense', '#8b5cf6', '🚗', [['fuel', 'الوقود', 'Fuel'], ['car_maintenance', 'صيانة السيارة', 'Car maintenance'], ['parking', 'المواقف', 'Parking'], ['public_transport', 'النقل العام', 'Public transport']]],\n  ['health', 'الصحة', 'Health', 'expense', '#ef4444', '🩺', [['pharmacy', 'الأدوية', 'Pharmacy'], ['clinics', 'العيادات', 'Clinics'], ['insurance', 'التأمين', 'Insurance']]],\n  ['shopping', 'التسوق', 'Shopping', 'expense', '#ec4899', '🛍️', [['clothing', 'الملابس', 'Clothing'], ['electronics', 'الإلكترونيات', 'Electronics'], ['personal_care', 'العناية الشخصية', 'Personal care']]],\n  ['obligations', 'الالتزامات', 'Obligations', 'expense', '#64748b', '📌', [['installments', 'الأقساط', 'Installments'], ['debts', 'الديون', 'Debts'], ['subscriptions', 'الاشتراكات والرسوم', 'Subscriptions & fees']]],\n  ['family', 'الأسرة', 'Family', 'expense', '#14b8a6', '👨‍👩‍👧', [['children', 'الأطفال', 'Children'], ['education', 'التعليم', 'Education'], ['shared', 'مصروفات مشتركة', 'Shared expenses']]],\n  ['entertainment', 'الترفيه', 'Entertainment', 'expense', '#eab308', '🎬', [['travel', 'السفر', 'Travel'], ['hobbies', 'الأنشطة والهوايات', 'Activities & hobbies']]],\n  ['savings', 'الادخار والاستثمار', 'Savings & investing', 'saving', '#22c55e', '🌱', []],\n  ['income', 'الدخل', 'Income', 'income', '#16a34a', '💰', [['salary', 'الرواتب', 'Salary'], ['bonus', 'المكافآت', 'Bonuses'], ['other_income', 'دخل إضافي', 'Other income']]],\n  ['other', 'أخرى', 'Other', 'other', '#94a3b8', '❓', []],\n];\n\nexport function seedCategories(db, userId) {\n  const ins = db.prepare('INSERT INTO categories (user_id,parent_id,key,name_ar,name_en,kind,color,icon) VALUES (?,?,?,?,?,?,?,?)');\n  for (const [key, ar, en, kind, color, icon, kids] of DEFAULT_CATEGORIES) {\n    const id = Number(ins.run(userId, null, key, ar, en, kind, color, icon).lastInsertRowid);\n    for (const [k, a, e] of kids) ins.run(userId, id, k, a, e, kind, color, icon);\n  }\n}\n","server/api.js":"import { tx as dbtx, audit } from './db.js';\nimport { all, one, run, HttpError, bad, notFound, owned, getProfile, categoryTree, categoryScope } from './lib/base.js';\nimport { toMinor, fromMinor, exponent, SUPPORTED_CURRENCIES } from './lib/money.js';\nimport { isIsoDate, addDays, diffDays, monthPeriod, previousPeriod, periodFor, weekPeriod, yearPeriod, todayIn } from './lib/dates.js';\nimport * as T from './lib/tx.js';\nimport * as F from './lib/finance.js';\nimport { capture, commitCapture } from './lib/capture.js';\nimport { previewImport, commitImport, exportTransactionsCSV } from './lib/csv.js';\nimport { answer } from './lib/assistant.js';\nimport { llmConfigured } from './lib/ai.js';\nimport { seedDemoData } from './lib/demo.js';\n\n// Isomorphic API core: no Node-only imports. Everything environment-specific is injected through `env`:\n//   env.auth     { register, login, createSession, destroySession, verifyPassword }\n//   env.storage  { put(userId, name, bytes) -> path, read(path) -> bytes|null, remove(path), removeUser(userId) }\n// Used by the Node HTTP server (server/app.js) and by the single-file browser build (standalone/).\nconst UPLOAD_TYPES = { 'image/png': ['png', [0x89, 0x50, 0x4e, 0x47]], 'image/jpeg': ['jpg', [0xff, 0xd8, 0xff]], 'application/pdf': ['pdf', [0x25, 0x50, 0x44, 0x46]], 'image/webp': ['webp', [0x52, 0x49, 0x46, 0x46]] };\nconst enc = new TextEncoder();\nconst uuid = () => (globalThis.crypto?.randomUUID ? crypto.randomUUID() : Array.from({ length: 4 }, () => Math.random().toString(16).slice(2, 10)).join(''));\nconst b64ToBytes = (str) => { try { return Uint8Array.from(atob(String(str).replace(/s+/g, '')), (ch) => ch.charCodeAt(0)); } catch { throw bad('file_content_mismatch'); } };\n\nconst optId = (v) => (v === undefined || v === null || v === '' ? null : Number(v));\nexport function createApi(db, env) {\n  const routes = [];\n  const add = (method, path, handler, opts = {}) => routes.push({ method, re: new RegExp(`^${path.replace(/:(\\w+)/g, '(?\u003c$1>[^/]+)')}$`), handler, ...opts });\n\n  const rangeFrom = (q, profile) => {\n    let { period = 'month', from, to } = Object.fromEntries(q);\n    let p;\n    if (from || to) { if (!isIsoDate(from) || !isIsoDate(to) || from > to) throw bad('invalid_range'); if (diffDays(from, to) > 800) throw bad('range_too_long'); p = { start: from, end: to }; }\n    else if (period === 'prev_month') p = previousPeriod('monthly', monthPeriod(profile.today, profile.month_start_day), profile.month_start_day);\n    else if (period === 'week') p = weekPeriod(profile.today);\n    else if (period === 'year') p = yearPeriod(profile.today);\n    else p = monthPeriod(profile.today, profile.month_start_day);\n    const len = diffDays(p.start, p.end) + 1;\n    const prev = (period === 'month' || period === 'prev_month') && !(from || to) ? previousPeriod('monthly', p, profile.month_start_day) : { start: addDays(p.start, -len), end: addDays(p.start, -1) };\n    return { p, prev };\n  };\n  const curOf = (q, profile) => { const c = (q.get('currency') || profile.currency).toUpperCase(); if (!SUPPORTED_CURRENCIES.includes(c)) throw bad('unsupported_currency'); return c; };\n\n  // ----- public / auth -----\n  add('POST', '/api/auth/register', (c) => {\n    const id = env.auth.register(db, c.body); const s = env.auth.createSession(db, id); c.setCookie(s); audit(db, id, 'user', id, 'register');\n    return { ok: true };\n  }, { public: true, limiter: 'auth' });\n  add('POST', '/api/auth/login', (c) => { const id = env.auth.login(db, c.body); c.setCookie(env.auth.createSession(db, id)); return { ok: true }; }, { public: true, limiter: 'auth' });\n  add('POST', '/api/auth/logout', (c) => { env.auth.destroySession(db, c.token); c.clearCookie(); return { ok: true }; }, { public: true });\n  add('GET', '/api/capabilities', () => ({\n    llm_extraction: llmConfigured(), receipt_extraction: false, voice: 'browser_speech_recognition_if_supported', excel_import: false, bank_sync: false, shared_budgets: false,\n    notes: { receipt_extraction: 'requires a vision-capable AI service (not configured); itemised invoices can be entered manually', excel_import: 'export as CSV first' },\n  }), { public: true });\n\n  // ----- me / profile -----\n  const meOut = (u) => { const p = getProfile(db, u); const { today, ...rest } = p; return { ...rest, today, email: one(db, 'SELECT email FROM users WHERE id=?', u).email }; };\n  add('GET', '/api/me', (c) => meOut(c.user));\n  add('PATCH', '/api/profile', (c) => {\n    const b = c.body, sets = [], p = [];\n    const set = (k, v) => { sets.push(`${k}=?`); p.push(v); };\n    if (b.name !== undefined) set('name', String(b.name).slice(0, 80));\n    if (b.language !== undefined) { if (!['ar', 'en'].includes(b.language)) throw bad('invalid_language'); set('language', b.language); }\n    if (b.currency !== undefined) { if (!SUPPORTED_CURRENCIES.includes(b.currency)) throw bad('unsupported_currency'); set('currency', b.currency); }\n    if (b.timezone !== undefined) { try { new Intl.DateTimeFormat('en', { timeZone: b.timezone }); } catch { throw bad('invalid_timezone'); } set('timezone', b.timezone); }\n    if (b.month_start_day !== undefined) { const d = Number(b.month_start_day); if (!Number.isInteger(d) || d \u003c 1 || d > 28) throw bad('invalid_month_start_day'); set('month_start_day', d); }\n    if (b.theme !== undefined) { if (!['system', 'light', 'dark'].includes(b.theme)) throw bad('invalid_theme'); set('theme', b.theme); }\n    if (b.default_account_id !== undefined) { const a = b.default_account_id === null ? null : owned(db, 'accounts', b.default_account_id, c.user).id; set('default_account_id', a); }\n    for (const [k, keys] of [['notif_prefs', ['budget', 'due', 'low_balance', 'anomaly', 'goal']], ['safe_prefs', ['reserve_goals', 'reserve_budgets']]]) {\n      if (b[k] !== undefined) { const cur = getProfile(db, c.user)[k]; for (const x of keys) if (b[k][x] !== undefined) cur[x] = !!b[k][x]; set(k, JSON.stringify(cur)); }\n    }\n    if (b.allow_ai_external !== undefined) set('allow_ai_external', b.allow_ai_external ? 1 : 0);\n    if (sets.length) run(db, `UPDATE profiles SET ${sets.join(',')}, updated_at=datetime('now') WHERE user_id=?`, ...p, c.user);\n    return meOut(c.user);\n  });\n  add('DELETE', '/api/me', async (c) => {\n    const u = one(db, 'SELECT * FROM users WHERE id=?', c.user);\n    if (c.body.confirm !== 'DELETE' || !env.auth.verifyPassword(String(c.body.password ?? ''), u.password_hash)) throw new HttpError(403, 'confirmation_failed');\n    dbtx(db, () => { // children first: RESTRICT foreign keys on accounts/categories would otherwise block the cascade\n      run(db, 'DELETE FROM transactions WHERE user_id=?', c.user);\n      run(db, 'DELETE FROM categories WHERE user_id=? AND parent_id IS NOT NULL', c.user);\n      run(db, 'DELETE FROM users WHERE id=?', c.user);\n    });\n    await env.storage.removeUser(c.user); c.clearCookie();\n    return { ok: true };\n  });\n  add('GET', '/api/export/all.json', (c) => {\n    const U = c.user; const tbl = (t) => all(db, `SELECT * FROM ${t} WHERE user_id=?`, U);\n    const data = { exported_at: new Date().toISOString(), profile: getProfile(db, U), accounts: tbl('accounts'), categories: tbl('categories'), merchants: tbl('merchants'), transactions: tbl('transactions'),\n      splits: all(db, 'SELECT s.* FROM transaction_splits s JOIN transactions t ON t.id=s.transaction_id WHERE t.user_id=?', U), items: all(db, 'SELECT i.* FROM transaction_items i JOIN transactions t ON t.id=i.transaction_id WHERE t.user_id=?', U),\n      budgets: tbl('budgets'), recurring_rules: tbl('recurring_rules'), savings_goals: tbl('savings_goals'), goal_contributions: tbl('goal_contributions'), fx_rates: tbl('fx_rates'), audit_logs: tbl('audit_logs') };\n    return c.file(JSON.stringify(data, null, 2), 'smart-finance-export.json', 'application/json');\n  });\n\n  // ----- categories -----\n  add('GET', '/api/categories', (c) => all(db, 'SELECT * FROM categories WHERE user_id=? ORDER BY COALESCE(parent_id,id), parent_id IS NOT NULL, id', c.user));\n  add('POST', '/api/categories', (c) => {\n    const b = c.body; const parent = b.parent_id ? owned(db, 'categories', b.parent_id, c.user) : null;\n    if (parent?.parent_id) throw bad('max_two_levels');\n    const ar = String(b.name_ar || b.name_en || '').trim().slice(0, 60), en = String(b.name_en || b.name_ar || '').trim().slice(0, 60);\n    if (!ar) throw bad('name_required');\n    const kind = parent?.kind ?? (['expense', 'income', 'saving', 'other'].includes(b.kind) ? b.kind : 'expense');\n    const color = /^#[0-9a-f]{6}$/i.test(b.color || '') ? b.color : (parent?.color ?? '#64748b');\n    const id = Number(run(db, 'INSERT INTO categories (user_id,parent_id,name_ar,name_en,kind,color,icon) VALUES (?,?,?,?,?,?,?)', c.user, parent?.id ?? null, ar, en, kind, color, String(b.icon || parent?.icon || '•').slice(0, 4)).lastInsertRowid);\n    audit(db, c.user, 'category', id, 'create'); return one(db, 'SELECT * FROM categories WHERE id=?', id);\n  });\n  add('PATCH', '/api/categories/:id', (c) => {\n    const cat = owned(db, 'categories', c.params.id, c.user); const b = c.body;\n    const col = b.color !== undefined && /^#[0-9a-f]{6}$/i.test(b.color) ? b.color : cat.color;\n    run(db, 'UPDATE categories SET name_ar=?, name_en=?, color=?, icon=?, archived=? WHERE id=? AND user_id=?', String(b.name_ar ?? cat.name_ar).slice(0, 60), String(b.name_en ?? cat.name_en).slice(0, 60), col, String(b.icon ?? cat.icon).slice(0, 4), b.archived === undefined ? cat.archived : (b.archived ? 1 : 0), cat.id, c.user);\n    audit(db, c.user, 'category', cat.id, 'update'); return one(db, 'SELECT * FROM categories WHERE id=?', cat.id);\n  });\n  add('DELETE', '/api/categories/:id', (c) => {\n    const cat = owned(db, 'categories', c.params.id, c.user);\n    if (cat.key === 'other') throw new HttpError(409, 'cannot_delete_fallback');\n    if (one(db, 'SELECT 1 x FROM categories WHERE parent_id=?', cat.id)) throw new HttpError(409, 'has_children');\n    const used = one(db, 'SELECT (SELECT COUNT(*) FROM transactions WHERE category_id=?1)+(SELECT COUNT(*) FROM transaction_splits WHERE category_id=?1)+(SELECT COUNT(*) FROM budgets WHERE category_id=?1)+(SELECT COUNT(*) FROM recurring_rules WHERE category_id=?1) n', cat.id).n;\n    const to = optId(c.query.get('reassign_to'));\n    if (used && !to) throw new HttpError(409, 'category_in_use', { uses: used });\n    dbtx(db, () => {\n      if (used) {\n        const t = owned(db, 'categories', to, c.user); if (t.id === cat.id) throw bad('invalid_reassign');\n        for (const tb of ['transactions', 'transaction_splits', 'recurring_rules', 'transaction_items']) run(db, `UPDATE ${tb} SET category_id=? WHERE category_id=?`, t.id, cat.id);\n        run(db, 'DELETE FROM budgets WHERE category_id=?', cat.id); // budgets are per category; merging would double-count\n        run(db, 'UPDATE learned_rules SET category_id=? WHERE category_id=?', t.id, cat.id);\n      }\n      run(db, 'DELETE FROM categories WHERE id=? AND user_id=?', cat.id, c.user); audit(db, c.user, 'category', cat.id, 'delete', { name: cat.name_en }, null);\n    });\n    return { ok: true };\n  });\n  add('GET', '/api/merchants', (c) => all(db, 'SELECT m.*, (SELECT COUNT(*) FROM transactions t WHERE t.merchant_id=m.id AND t.deleted_at IS NULL) AS tx_count FROM merchants m WHERE user_id=? ORDER BY name', c.user));\n  add('PATCH', '/api/merchants/:id', (c) => { const m = owned(db, 'merchants', c.params.id, c.user); const cat = c.body.default_category_id ? owned(db, 'categories', c.body.default_category_id, c.user).id : null; run(db, 'UPDATE merchants SET default_category_id=? WHERE id=? AND user_id=?', cat, m.id, c.user); return { ok: true }; });\n\n  // ----- accounts -----\n  const acctOut = (a) => ({ ...a, balance: fromMinor(a.balance, a.currency), opening_balance: fromMinor(a.opening_balance, a.currency), credit_limit: a.credit_limit == null ? null : fromMinor(a.credit_limit, a.currency),\n    verified_balance: a.verified_balance == null ? null : fromMinor(a.verified_balance, a.currency), available_credit: a.available_credit == null ? null : fromMinor(a.available_credit, a.currency) });\n  add('GET', '/api/accounts', (c) => F.accountBalances(db, c.user).map(acctOut));\n  add('POST', '/api/accounts', (c) => {\n    const b = c.body; if (!['cash', 'bank', 'wallet', 'credit_card', 'savings'].includes(b.type)) throw bad('invalid_type');\n    const cur = String(b.currency || c.profile().currency).toUpperCase(); if (!SUPPORTED_CURRENCIES.includes(cur)) throw bad('unsupported_currency');\n    const name = String(b.name ?? '').trim().slice(0, 60); if (!name) throw bad('name_required');\n    const id = Number(run(db, 'INSERT INTO accounts (user_id,name,type,currency,opening_balance,credit_limit) VALUES (?,?,?,?,?,?)', c.user, name, b.type, cur, b.opening_balance ? toMinor(b.opening_balance, cur) : 0, b.credit_limit ? toMinor(b.credit_limit, cur) : null).lastInsertRowid);\n    audit(db, c.user, 'account', id, 'create'); return acctOut(F.accountBalances(db, c.user).find((a) => a.id === id));\n  });\n  add('PATCH', '/api/accounts/:id', (c) => {\n    const a = owned(db, 'accounts', c.params.id, c.user); const b = c.body;\n    const hasTx = one(db, 'SELECT 1 x FROM transactions WHERE (account_id=? OR to_account_id=?) AND deleted_at IS NULL', a.id, a.id);\n    if (b.currency && b.currency !== a.currency && hasTx) throw new HttpError(409, 'currency_locked');\n    run(db, 'UPDATE accounts SET name=?, opening_balance=?, credit_limit=?, archived=?, updated_at=datetime(\\'now\\') WHERE id=? AND user_id=?', String(b.name ?? a.name).slice(0, 60),\n      b.opening_balance !== undefined ? toMinor(b.opening_balance, a.currency) : a.opening_balance, b.credit_limit !== undefined ? (b.credit_limit === null ? null : toMinor(b.credit_limit, a.currency)) : a.credit_limit, b.archived === undefined ? a.archived : (b.archived ? 1 : 0), a.id, c.user);\n    audit(db, c.user, 'account', a.id, 'update', { opening_balance: a.opening_balance }, null); return acctOut(F.accountBalances(db, c.user).find((x) => x.id === a.id));\n  });\n  add('POST', '/api/accounts/:id/verify', (c) => { // user-entered checkpoint from their bank statement; not an automatic sync\n    const a = owned(db, 'accounts', c.params.id, c.user); run(db, \"UPDATE accounts SET verified_balance=?, verified_at=datetime('now') WHERE id=?\", toMinor(c.body.balance, a.currency), a.id);\n    return acctOut(F.accountBalances(db, c.user).find((x) => x.id === a.id));\n  });\n  add('DELETE', '/api/accounts/:id', (c) => {\n    const a = owned(db, 'accounts', c.params.id, c.user);\n    if (one(db, 'SELECT 1 x FROM transactions WHERE (account_id=? OR to_account_id=?)', a.id, a.id)) throw new HttpError(409, 'account_has_transactions', { hint: 'archive' });\n    run(db, 'DELETE FROM accounts WHERE id=? AND user_id=?', a.id, c.user); audit(db, c.user, 'account', a.id, 'delete'); return { ok: true };\n  });\n\n  // ----- transactions -----\n  add('GET', '/api/transactions', (c) => T.listTransactions(db, c.user, Object.fromEntries(c.query)));\n  add('POST', '/api/transactions', (c) => T.createTransaction(db, c.user, c.body, c.profile(), { force: c.query.get('force') === '1' }));\n  add('GET', '/api/transactions/:id', (c) => T.getTransaction(db, c.user, c.params.id));\n  add('PATCH', '/api/transactions/:id', (c) => T.updateTransaction(db, c.user, Number(c.params.id), c.body, c.profile()));\n  add('DELETE', '/api/transactions/:id', (c) => { if (!T.deleteTransactions(db, c.user, [c.params.id])) throw notFound('transaction_not_found'); return { ok: true }; });\n  add('POST', '/api/transactions/bulk', (c) => {\n    const { ids, action } = c.body; if (!Array.isArray(ids) || !ids.length || ids.length > 500) throw bad('invalid_ids');\n    if (action === 'delete') { if (c.body.confirm !== true) throw new HttpError(409, 'confirmation_required', { count: ids.length }); return { affected: T.deleteTransactions(db, c.user, ids) }; }\n    if (action === 'categorize') return { affected: T.bulkUpdate(db, c.user, ids, { category_id: c.body.category_id }) };\n    if (action === 'confirm') return { affected: T.bulkUpdate(db, c.user, ids, { status: 'confirmed' }) };\n    throw bad('invalid_action');\n  });\n  add('POST', '/api/invoices/check', (c) => {\n    const b = c.body; const cur = (b.currency || c.profile().currency).toUpperCase();\n    const items = (b.items ?? []).map((i) => ({ amount: i.amount !== undefined && i.amount !== '' ? toMinor(i.amount, cur) : Math.round(toMinor(i.unit_price ?? 0, cur) * Number(i.quantity ?? 1)) }));\n    const r = T.reconcileInvoice({ items, tax: b.tax ? toMinor(b.tax, cur) : 0, discount: b.discount ? toMinor(b.discount, cur) : 0, total: toMinor(b.total, cur) });\n    return { items_sum: fromMinor(r.items_sum, cur), expected: fromMinor(r.expected, cur), total: fromMinor(r.total, cur), diff: fromMinor(r.diff, cur), matches: r.matches };\n  });\n  add('POST', '/api/transactions/:id/attachments', async (c) => {\n    const t = one(db, 'SELECT id FROM transactions WHERE id=? AND user_id=? AND deleted_at IS NULL', Number(c.params.id), c.user); if (!t) throw notFound('transaction_not_found');\n    const spec = UPLOAD_TYPES[c.body.mime]; if (!spec) throw bad('unsupported_file_type');\n    const buf = b64ToBytes(c.body.data ?? '');\n    if (!buf.length || buf.length > 4 * 1024 * 1024) throw bad('file_size_invalid');\n    if (!spec[1].every((b, i) => buf[i] === b)) throw bad('file_content_mismatch'); // magic-number check\n    const path = await env.storage.put(c.user, `${uuid()}.${spec[0]}`, buf);\n    const fi
