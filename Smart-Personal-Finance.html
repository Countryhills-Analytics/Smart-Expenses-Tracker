lename = String(c.body.filename || `file.${spec[0]}`).replace(/[^\\w.\\-؀-ۿ ]/g, '_').slice(0, 100);\n    const id = Number(run(db, 'INSERT INTO attachments (user_id,transaction_id,filename,mime,size,path) VALUES (?,?,?,?,?,?)', c.user, t.id, filename, c.body.mime, buf.length, path).lastInsertRowid);\n    return { id, filename, mime: c.body.mime, size: buf.length };\n  });\n  add('GET', '/api/attachments/:id', async (c) => {\n    const a = owned(db, 'attachments', c.params.id, c.user); const bytes = await env.storage.read(a.path);\n    if (!bytes) throw notFound('file_missing');\n    return c.raw(bytes, a.mime, { 'Content-Disposition': `attachment; filename*=UTF-8''${encodeURIComponent(a.filename)}` });\n  });\n  add('DELETE', '/api/attachments/:id', async (c) => { const a = owned(db, 'attachments', c.params.id, c.user); await env.storage.remove(a.path); run(db, 'DELETE FROM attachments WHERE id=?', a.id); return { ok: true }; });\n\n  // ----- capture -----\n  add('POST', '/api/capture', async (c) => capture(db, c.user, c.body.text, c.profile()), { limiter: 'ai' });\n  add('POST', '/api/capture/commit', (c) => ({ ids: commitCapture(db, c.user, { ...c.body, force: c.query.get('force') === '1' }, c.profile()) }));\n\n  // ----- budgets -----\n  const budOut = (b) => ({ ...b, amount: fromMinor(b.amount, b.currency), limit: fromMinor(b.limit, b.currency), spent: fromMinor(b.spent, b.currency), remaining: fromMinor(b.remaining, b.currency), carry: fromMinor(b.carry, b.currency), forecast: b.forecast == null ? null : fromMinor(b.forecast, b.currency) });\n  add('GET', '/api/budgets', (c) => F.budgetStatus(db, c.user, c.profile()).map(budOut));\n  add('POST', '/api/budgets', (c) => {\n    const b = c.body, cur = String(b.currency || c.profile().currency).toUpperCase(); if (!['weekly', 'monthly', 'yearly'].includes(b.period)) throw bad('invalid_period');\n    const cat = b.category_id ? owned(db, 'categories', b.category_id, c.user).id : null; const amt = toMinor(b.amount, thing leaves the device\n//   * there are no accounts or sessions: one local ledger per browser profile\nimport { MiniDatabase } from './minisql.js';\nimport { openDb, seedCategories } from '../server/db.js';\nimport { createApi, errorResponse } from '../server/api.js';\nimport { HttpError } from '../server/lib/base.js';\n\nconst DB_NAME = 'smart-personal-finance', SNAP = 'snapshot', USER_ID = 1;\nconst hasIdb = typeof indexedDB !== 'undefined';\nlet idb = null; let db = null; let api = null; let persistence = { mode: hasIdb ? 'indexeddb' : 'memory', persisted: false, error: null };\n\nconst req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });\nasync function openIdb() {\n  const open = indexedDB.open(DB_NAME, 1);\n  open.onupgradeneeded = () => { open.result.createObjectStore('kv'); open.result.createObjectStore('files'); };\n  return req(open);\n}\nconst store = (name, mode = 'readonly') => idb.transaction(name, mode).objectStore(name);\nconst kvGet = (k) => (idb ? req(store('kv').get(k)) : Promise.resolve(undefined));\nconst kvPut = (k, v) => (idb ? req(store('kv', 'readwrite').put(v, k)) : Promise.resolve());\n\n// ---- persistence (debounced snapshot of all tables) ----\nlet timer = null, saving = Promise.resolve();\n// write-through: one snapshot per synchronous burst of changes (microtask-coalesced), so a reload right after a change keeps it\nlet queued = false;\nfunction scheduleSave() { if (queued) return; queued = true; queueMicrotask(() => { queued = false; saveNow(); }); }\nfunction saveNow() {\n  clearTimeout(timer);\n  saving = saving.then(() => kvPut(SNAP, JSON.stringify(db.serialize()))).catch((e) => { persistence.error = String(e?.message ?? e); console.error('save failed', persistence.error); });\n  return saving;\n}\naddEventListener('pagehide', saveNow); addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });\n\n// ---- attachments (private blobs in IndexedDB) ----\nconst storage = {\n  async put(userId, name, bytes) { const p = `${userId}/${name}`; if (idb) await req(store('files', 'readwrite').put(bytes, p)); else (storage.mem ??= new Map()).set(p, bytes); return p; },\n  async read(p) { if (idb) return (await req(store('files').get(p))) ?? null; return storage.mem?.get(p) ?? null; },\n  async remove(p) { if (idb) await req(store('files', 'readwrite').delete(p)); else storage.mem?.delete(p); },\n  async removeUser() { if (idb) await req(store('files', 'readwrite').clear()); else storage.mem?.clear(); },\n};\nconst notAvailable = () => { throw new HttpError(404, 'not_found'); };\nconst auth = { register: notAvailable, login: notAvailable, createSession: notAvailable, destroySession: () => {}, verifyPassword: () => true };\n\n// ---- one local user, created on first use (and again after \"erase all data\") ----\nfunction ensureUser() {\n  const row = db.prepare('SELECT id FROM users WHERE id=?').get(USER_ID);\n  if (row) return;\n  db.prepare(\"INSERT INTO users (id,email,password_hash) VALUES (?,?,?)\").run(USER_ID, 'local@this-device', 'local');\n  let lang = 'ar'; try { lang = localStorage.getItem('spf_lang') || (/^ar/i.test(navigator.language) ? 'ar' : 'en'); } catch { /* default */ }\n  let tz = 'Asia/Riyadh'; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch { /* default */ }\n  db.prepare('INSERT INTO profiles (user_id,name,language,timezone) VALUES (?,?,?,?)').run(USER_ID, null, lang === 'en' ? 'en' : 'ar', tz);\n  seedCategories(db, USER_ID);\n}\n\n// ---- request dispatch ----\nasync function dispatch(method, rawUrl, bodyText) {\n  const url = new URL(rawUrl, 'http://local'); ensureUser();\n  const route = api.find(method, url.pathname);\n  const json = (status, obj) => ({ status, type: 'application/json; charset=utf-8', body: JSON.stringify(obj), headers: {} });\n  if (!route) return json(404, { error: 'not_found' });\n  try {\n    let body = {}; if (method !== 'GET' && bodyText) { try { body = JSON.parse(bodyText); } catch { throw new HttpError(400, 'invalid_json'); } }\n    const { out } = await api.run(route, { pathname: url.pathname, query: url.searchParams, body: body && typeof body === 'object' ? body : {}, user: USER_ID, token: null });\n    if (out && out.__raw) return { status: 200, type: out.type, body: out.__raw, headers: out.headers ?? {} };\n    return json(200, out ?? { ok: true });\n  } catch (e) { const r = errorResponse(e); return json(r.status, r.body); }\n}\n\nfunction installFetch() {\n  const real = window.fetch.bind(window);\n  window.fetch = async (input, init = {}) => {\n    const u = typeof input === 'string' ? input : input.url;\n    if (!u.startsWith('/api/')) return Promise.reject(new TypeError('network access is disabled in the offline build'));\n    const r = await dispatch((init.method ?? 'GET').toUpperCase(), u, init.body);\n    return new Response(r.body, { status: r.status, headers: { 'Content-Type': r.type } });\n  };\n  void real;\n  // links such as \u003ca href=\"/api/export/...\" download> are served locally and saved through a blob URL\n  document.addEventListener('click', async (ev) => {\n    const a = ev.target.closest?.('a[href^=\"/api/\"]'); if (!a) return;\n    ev.preventDefault();\n    const r = await dispatch('GET', a.getAttribute('href'));\n    if (r.status !== 200) { alert('Download failed'); return; }\n    const cd = r.headers['Content-Disposition'] ?? ''; const m = /filename\\*=UTF-8''([^;]+)/.exec(cd) ?? /filename=\"([^\"]+)\"/.exec(cd);\n    const name = (m ? decodeURIComponent(m[1]) : a.getAttribute('download')) || 'download';\n    const blobUrl = URL.createObjectURL(new Blob([r.body], { type: r.type })); const link = document.createElement('a');\n    link.href = blobUrl; link.download = name; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);\n  }, true);\n}\n\n// ---- backup / restore (the only way to move data bet ublic/js/main.js');\n"}</script>
<script type="module">
